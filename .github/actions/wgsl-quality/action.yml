name: Validate tracked WGSL on the CPU
description: Compile a pinned Naga validator with managed shared sccache and test assembled shaders
inputs:
  manifest:
    required: true
    description: Exact Git-tracked source manifest
runs:
  using: composite
  steps:
    - name: Install stable Rust without changing compiler selection
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../install-rust-toolchain/install.sh" stable
    - name: Configure managed sccache
      uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@169c8823c1bb0f5e5645ad813b441d605d49d5bb # main
      with:
        rust-toolchain: stable
        rustflags: ""
    - name: Validate complete WGSL modules with Naga
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/wgsl-quality-target"
        # Validation is source-analysis, not a CPU benchmark. Debug builds avoid
        # optimized Naga compilation cost on congested remote workers.
        cargo +stable run --locked \
          --manifest-path "$GITHUB_ACTION_PATH/../../../languages/wgsl/Cargo.toml" \
          --target-dir "$RUNNER_TEMP/wgsl-quality-target" -- \
          "$GITHUB_WORKSPACE" "${{ inputs.manifest }}"
    - name: Finalize managed sccache
      if: always()
      uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@169c8823c1bb0f5e5645ad813b441d605d49d5bb # main
