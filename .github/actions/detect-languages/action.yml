name: Discover tracked source languages
description: Identify Git-tracked Java, Rust, shell, JavaScript/TypeScript, Python and WGSL sources
inputs:
  source-root:
    description: Path to the root of the caller checkout
    required: true
  manifest:
    description: Absolute path for JSON manifest (under runner.temp)
    required: true
outputs:
  has-java:
    value: ${{ steps.detect.outputs.has_java }}
    description: Java files are present in the caller Git checkout
  has-rust:
    value: ${{ steps.detect.outputs.has_rust }}
    description: Rust files are present in the caller Git checkout
  java-count:
    value: ${{ steps.detect.outputs.java_count }}

  has-shell:
    value: ${{ steps.detect.outputs.has_shell }}
  shell-count:
    value: ${{ steps.detect.outputs.shell_count }}
  has-javascript:
    value: ${{ steps.detect.outputs.has_javascript }}
  javascript-count:
    value: ${{ steps.detect.outputs.javascript_count }}
  typescript-count:
    value: ${{ steps.detect.outputs.typescript_count }}
  has-python:
    value: ${{ steps.detect.outputs.has_python }}
  python-count:
    value: ${{ steps.detect.outputs.python_count }}
  has-wgsl:
    value: ${{ steps.detect.outputs.has_wgsl }}
  wgsl-count:
    value: ${{ steps.detect.outputs.wgsl_count }}
runs:
  using: composite
  steps:
    - name: Inspect tracked source languages
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/../../../languages/detect.mjs" \
          "${{ inputs.source-root }}" "${{ inputs.manifest }}" "$GITHUB_OUTPUT"