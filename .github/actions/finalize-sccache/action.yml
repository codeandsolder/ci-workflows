name: Finalize canonical sccache
description: Verify the mandatory CI cache backend and persist trusted public caches.
runs:
  using: composite
  steps:
    - name: Verify public sccache and stop daemon
      if: env.CODEANDSOLDER_SCCACHE_MODE == 'public-actions'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${SCCACHE_BIN:-}" ]]; then
          echo "SCCACHE_BIN is missing; setup-sccache did not run" >&2
          exit 1
        fi
        stats_json="$("$SCCACHE_BIN" --show-stats --stats-format json)"
        "$SCCACHE_BIN" --show-stats
        errors="$(printf '%s' "$stats_json" | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            const stats = JSON.parse(input).stats ?? {};
            process.stdout.write(`${stats.cache_read_errors ?? 0} ${stats.cache_write_errors ?? 0}`);
          });
        ')"
        read -r read_errors write_errors <<< "$errors"
        "$SCCACHE_BIN" --stop-server || true
        if (( read_errors != 0 || write_errors != 0 )); then
          echo "sccache backend errors: read=$read_errors write=$write_errors" >&2
          exit 1
        fi

    - name: Verify private Asus Garage connection
      if: env.CODEANDSOLDER_SCCACHE_MODE == 'private-asus-garage'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${SCCACHE_BIN:-}" ]]; then
          echo "SCCACHE_BIN is missing; setup-sccache did not run" >&2
          exit 1
        fi
        "$SCCACHE_BIN" --show-stats

    - name: Save trusted public compiler cache
      if: >-
        env.CODEANDSOLDER_SCCACHE_MODE == 'public-actions' &&
        env.CODEANDSOLDER_SCCACHE_CACHE_HIT != 'true' &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/sccache
        key: ${{ env.CODEANDSOLDER_SCCACHE_CACHE_KEY }}
