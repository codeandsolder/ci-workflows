name: "Detect new duplicated code"
description: "Check a repository against its Git base with pinned doppelscan"
inputs:
  base-sha:
    description: Git event base revision
    required: true
  pr-head-sha:
    description: Expected PR head, empty for non-PR events
    default: ""
runs:
  using: composite
  steps:
    - name: Compare clones against base
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        PR_HEAD_SHA: ${{ inputs.pr-head-sha }}
      run: >-
        bash "$GITHUB_ACTION_PATH/../../scripts/run-clone-regression.sh"
        "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$BASE_SHA" "$PR_HEAD_SHA"
