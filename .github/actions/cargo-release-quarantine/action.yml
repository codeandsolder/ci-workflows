name: Cargo release-age quarantine
description: Reject newly introduced crates.io package versions younger than a configured age.
inputs:
  base-ref:
    description: Commit/ref whose lockfile is the comparison baseline.
    required: true
  hours:
    description: Minimum release age in hours.
    required: false
    default: "72"
  lockfile:
    description: Repository-relative Cargo lockfile path, or auto for all tracked workspaces.
    required: false
    default: auto
  fail-on-blocked:
    description: Fail the action when quarantine is still active; set false for eligibility probes.
    required: false
    default: "true"
outputs:
  eligible:
    description: true when all newly introduced crates.io versions have cleared quarantine.
    value: ${{ steps.quarantine.outputs.eligible }}
runs:
  using: composite
  steps:
    - name: Fetch quarantine baseline
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        bash "${GITHUB_ACTION_PATH}/fetch_baseline.sh" "${BASE_REF}"

    - name: Check release ages
      id: quarantine
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        HOURS: ${{ inputs.hours }}
        LOCKFILE: ${{ inputs.lockfile }}
        FAIL_ON_BLOCKED: ${{ inputs.fail-on-blocked }}
      run: |
        set -euo pipefail
        set +e
        node "${GITHUB_ACTION_PATH}/../../../policy-wasm/quarantine.mjs" \
          "${GITHUB_ACTION_PATH}/../../../policy-wasm/module.json" \
          "${BASE_REF}" "${HOURS}" "${LOCKFILE}"
        status=$?
        set -e

        case "${status}" in
          0)
            echo "eligible=true" >>"${GITHUB_OUTPUT}"
            ;;
          10)
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            if [[ "${FAIL_ON_BLOCKED}" == "true" ]]; then
              exit 1
            fi
            ;;
          11)
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "Authoritative crates.io release metadata unavailable; retry after the transport recovers." >&2
            exit 1
            ;;
          *)
            echo "Quarantine helper failed unexpectedly with status ${status}." >&2
            exit "${status}"
            ;;
        esac
