name: Enforce PR workflow supersession
description: Check all PR-triggered Actions workflows for correct workflow-level cancellation
runs:
  using: composite
  steps:
    - name: Validate every PR workflow
      shell: bash
      run: >-
        node "$GITHUB_ACTION_PATH/../../../policy-wasm/run.mjs"
        "$GITHUB_ACTION_PATH/../../../policy-wasm/module.json"
        concurrency "$GITHUB_WORKSPACE"
