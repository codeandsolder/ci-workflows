name: Rust dependency quality (informational)
description: RustSec advisories and unused direct dependencies without a compilation pass.
inputs:
  working-directory:
    description: Cargo workspace relative to caller repository checkout
    default: "."
    required: false
runs:
  using: composite
  steps:
    - name: Install pinned Rust dependency scanners
      id: tools
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
      continue-on-error: true
      with:
        tool: cargo-deny@0.20.2,cargo-machete@0.10.1

    - name: Audit advisories and unused direct dependencies
      if: always()
      shell: bash
      continue-on-error: true
      env:
        DEPENDENCY_WORKDIR: ${{ inputs.working-directory }}
        DEPENDENCY_SCANNERS_INSTALLED: ${{ steps.tools.outcome }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"

    - name: Log dependency findings in private repositories
      if: always() && github.event.repository.private
      shell: bash
      continue-on-error: true
      run: |
        if [[ -f "$RUNNER_TEMP/rust-dependency-quality/results.json" ]]; then
          cat "$RUNNER_TEMP/rust-dependency-quality/results.json"
        fi

    - name: Upload dependency findings
      if: always() && !github.event.repository.private
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: rust-dependency-health-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rust-dependency-quality/
        if-no-files-found: warn
        retention-days: 14
