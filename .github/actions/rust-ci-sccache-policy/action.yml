name: Enforce canonical Rust CI sccache
description: Validate Rust compiling workflows against centrally owned cache lifecycle rules
inputs:
  strict-ref:
    description: Expected immutable rust-skills2 strict gate commit SHA
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate Rust CI cache contracts
      shell: bash
      env:
        EXPECTED_STRICT_REF: ${{ inputs.strict-ref }}
      run: >-
        node "$GITHUB_ACTION_PATH/../../../policy-wasm/run.mjs"
        "$GITHUB_ACTION_PATH/../../../policy-wasm/module.json"
        sccache "$GITHUB_WORKSPACE" "$EXPECTED_STRICT_REF"
