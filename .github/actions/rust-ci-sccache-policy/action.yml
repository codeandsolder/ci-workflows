name: Enforce canonical Rust CI sccache
description: Validate Rust compiling workflows against centrally owned cache lifecycle rules
inputs:
  strict-ref:
    description: Expected immutable rust-skills2 strict gate commit SHA
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install uv for locked policy dependencies
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    - name: Validate Rust CI cache contracts
      shell: bash
      env:
        POLICY_ACTION_DIR: ${{ github.action_path }}
        EXPECTED_STRICT_REF: ${{ inputs.strict-ref }}
      run: >-
        uv run --project "$POLICY_ACTION_DIR/../.." --locked python
        "$POLICY_ACTION_DIR/check.py"
        --root "$GITHUB_WORKSPACE"
        --strict-ref "$EXPECTED_STRICT_REF"
