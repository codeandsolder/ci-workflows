name: "Test clone regression policy"
description: "Execute isolated Git-revision fixtures against the real duplication scanner"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: false
    - name: Verify baseline, production/test classification, and explicit accepts
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../scripts/test-clone-regression.sh"
