name: Unified Rust test suite
description: Run the full Nextest suite once, collect per-test coverage, predict affected tests, and generate aggregate reports
inputs:
  test-suite:
    description: JSON test configuration (directory, cargo, nextest, doctests, coverage)
    required: true
runs:
  using: composite
  steps:
    - name: Prepare canonical test suite and baseline scope
      id: suite
      shell: bash
      env:
        TEST_SUITE: ${{ inputs.test-suite }}
      run: node "$GITHUB_ACTION_PATH/suite.mjs" prepare

    - name: Install pinned Nextest
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
      with:
        tool: cargo-nextest@0.9.152

    - name: Install pinned cargo-affected collector
      shell: bash
      run: node "$GITHUB_ACTION_PATH/suite.mjs" install

    - name: Restore last compatible coverage baseline
      id: restore
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.suite.outputs.db-path }}
        key: ${{ steps.suite.outputs.prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.suite.outputs.prefix }}

    - name: Execute full instrumented Nextest suite once
      id: full
      continue-on-error: true
      shell: bash
      env:
        TEST_SUITE: ${{ inputs.test-suite }}
        IMPACT_DIR: ${{ steps.suite.outputs.impact-dir }}
      run: node "$GITHUB_ACTION_PATH/suite.mjs" collect

    - name: Compare prior selection with actual full-suite results
      if: ${{ !cancelled() && steps.suite.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        FULL_SUCCESS: ${{ steps.full.outcome == 'success' }}
        IMPACT_DIR: ${{ steps.suite.outputs.impact-dir }}
      run: |
        node "$GITHUB_ACTION_PATH/compare.mjs" \
          "$IMPACT_DIR/selection.json" "$IMPACT_DIR/nextest.jsonl" \
          "$FULL_SUCCESS" "$IMPACT_DIR/comparison.json"

    - name: Save successful coverage baseline
      if: ${{ steps.full.outcome == 'success' && steps.restore.outputs.cache-hit != 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.suite.outputs.db-path }}
        key: ${{ steps.suite.outputs.prefix }}${{ github.sha }}

    - name: Publish test-impact diagnostics
      if: ${{ !cancelled() && steps.suite.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: rust-test-impact-${{ github.job }}-${{ github.run_attempt }}-${{ steps.suite.outputs.artifact-suffix }}
        path: |
          ${{ steps.suite.outputs.impact-dir }}/nextest.jsonl
          ${{ steps.suite.outputs.impact-dir }}/selection.json
          ${{ steps.suite.outputs.impact-dir }}/comparison.json
        if-no-files-found: warn
        retention-days: 14

    - name: Install pinned cargo-llvm-cov reporter
      if: ${{ steps.full.outcome == 'success' && steps.suite.outputs.coverage == 'true' }}
      continue-on-error: true
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
      with:
        tool: cargo-llvm-cov@0.9.2

    - name: Generate coverage reports from the same execution
      if: ${{ steps.full.outcome == 'success' && steps.suite.outputs.coverage == 'true' }}
      id: coverage
      continue-on-error: true
      shell: bash
      env:
        TEST_SUITE: ${{ inputs.test-suite }}
        IMPACT_DIR: ${{ steps.suite.outputs.impact-dir }}
        COVERAGE_DIR: ${{ steps.suite.outputs.coverage-dir }}
      run: node "$GITHUB_ACTION_PATH/suite.mjs" report

    - name: Upload coverage artifact
      if: ${{ !cancelled() && steps.suite.outputs.coverage == 'true' }}
      id: upload-coverage
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: rust-coverage-${{ github.job }}-${{ github.run_attempt }}-${{ steps.suite.outputs.artifact-suffix }}
        path: ${{ steps.suite.outputs.coverage-dir }}
        retention-days: 14
        if-no-files-found: warn

    - name: Write coverage summary
      if: ${{ !cancelled() && steps.suite.outputs.coverage == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        COVERAGE_JSON: ${{ steps.suite.outputs.coverage-dir }}/coverage.json
        COVERAGE_STATUS: ${{ steps.coverage.outcome }}
        COVERAGE_ARTIFACT_URL: ${{ steps.upload-coverage.outputs.artifact-url }}
        COVERAGE_DIRECTORY: ${{ steps.suite.outputs.directory }}
      run: node "$GITHUB_ACTION_PATH/../rust-coverage/summary.mjs"

    - name: Execute separate doctest scope
      if: ${{ !cancelled() && steps.suite.outputs.doctests == 'true' }}
      id: doctests
      continue-on-error: true
      shell: bash
      env:
        TEST_SUITE: ${{ inputs.test-suite }}
      run: node "$GITHUB_ACTION_PATH/suite.mjs" doctests

    - name: Enforce authoritative full-suite result
      if: ${{ !cancelled() }}
      shell: bash
      env:
        FULL_OUTCOME: ${{ steps.full.outcome }}
        DOCTESTS: ${{ steps.suite.outputs.doctests }}
        DOCTEST_OUTCOME: ${{ steps.doctests.outcome }}
      run: |
        if [[ "$FULL_OUTCOME" != success || ( "$DOCTESTS" == true && "$DOCTEST_OUTCOME" != success ) ]]; then
          echo "Authoritative test execution failed or did not complete." >&2
          exit 1
        fi
