name: Setup canonical sccache
description: Configure the mandatory compiler cache for codeandsolder CI.
inputs:
  rust-toolchain:
    description: Optional Rust toolchain identity override for the public cache key; normally detected from rustc.
    required: false
    default: ""
  rustflags:
    description: Optional RUSTFLAGS override for the public cache key; normally inherited from the job environment.
    required: false
    default: ""
  repository-path:
    description: Git checkout path relative to the workspace; use for builds with multiple checkouts.
    required: false
    default: "."
  cache-scope:
    description: Stable compilation workload identity; defaults to the caller workflow and job.
    required: false
    default: ""
  cache-size-mib:
    description: Maximum public GitHub-hosted sccache size in MiB.
    required: false
    default: "6144"
outputs:
  mode:
    description: public-actions or private-local-garage
    value: ${{ steps.mode.outputs.mode }}
  cache-hit:
    description: Exact public compiler-cache key hit.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-key:
    description: Exact public compiler-cache key.
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - name: Select canonical cache backend
      id: mode
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ github.event.repository.private }}" == "true" ]]; then
          echo "mode=private-local-garage" >> "$GITHUB_OUTPUT"
        else
          echo "mode=public-actions" >> "$GITHUB_OUTPUT"
        fi

    - name: Install public sccache client
      if: steps.mode.outputs.mode == 'public-actions'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
        disable_annotations: true

    - name: Compute public compiler-cache key
      if: steps.mode.outputs.mode == 'public-actions'
      id: key
      shell: bash
      env:
        CACHE_SIZE_MIB: ${{ inputs.cache-size-mib }}
        CACHE_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        CACHE_RUSTFLAGS: ${{ inputs.rustflags }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        CACHE_REPOSITORY_PATH: ${{ inputs.repository-path }}
      run: |
        set -euo pipefail
        case "$CACHE_SIZE_MIB" in
          *[!0-9]*|'') echo "cache-size-mib must be an integer" >&2; exit 2 ;;
        esac
        if (( CACHE_SIZE_MIB < 1 )); then
          echo "cache-size-mib must be positive" >&2
          exit 2
        fi

        bash "$GITHUB_ACTION_PATH/public-cache-key.sh"

    - name: Restore public compiler cache
      if: steps.mode.outputs.mode == 'public-actions'
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/sccache
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.graph-prefix }}
          ${{ steps.key.outputs.workload-prefix }}
          ${{ steps.key.outputs.restore-prefix }}

    - name: Configure public runner-local sccache
      if: steps.mode.outputs.mode == 'public-actions'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_SIZE_MIB: ${{ inputs.cache-size-mib }}
      run: |
        set -euo pipefail
        sccache_bin="${SCCACHE_PATH:-$(command -v sccache)}"
        if [[ -z "$sccache_bin" || ! -x "$sccache_bin" ]]; then
          echo "public sccache client is unavailable" >&2
          exit 1
        fi
        cache_dir="$RUNNER_TEMP/sccache"
        mkdir -p "$cache_dir"
        export SCCACHE_DIR="$cache_dir"
        export SCCACHE_CACHE_SIZE="${CACHE_SIZE_MIB}M"
        {
          echo "RUSTC_WRAPPER=$sccache_bin"
          echo "SCCACHE_BIN=$sccache_bin"
          echo "SCCACHE_DIR=$SCCACHE_DIR"
          echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          echo "CODEANDSOLDER_SCCACHE_CACHE_HIT=${CACHE_HIT:-false}"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"
        "$sccache_bin" --start-server
        "$sccache_bin" --zero-stats
        "$sccache_bin" --version

    - name: Configure private managed Garage sccache
      if: steps.mode.outputs.mode == 'private-local-garage'
      shell: bash
      run: |
        set -euo pipefail
        # Repository-specific runner registrations may live on Acer or Asus.
        # Select the existing managed sccache client by filesystem capability,
        # not a runner-name convention. Never spawn an unconfigured daemon.
        shim_dir="$RUNNER_TEMP/codeandsolder-sccache"
        mkdir -p "$shim_dir"
        if [[ -S /run/host-sccache/sccache.sock && -x /usr/local/bin/sccache ]]; then
          # The container's mounted client must be compatible with the host
          # daemon protocol. Connection errors are fatal, not cache misses.
          transport=container-managed-uds
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'exec env -u SCCACHE_SERVER_PORT SCCACHE_SERVER_UDS=/run/host-sccache/sccache.sock SCCACHE_START_SERVER=0 SCCACHE_NO_AUTO_START_SERVER=1 /usr/local/bin/sccache "$@"' \
            > "$shim_dir/sccache"
        elif [[ -x /usr/local/libexec/sccache-client ]]; then
          transport=host-managed-client
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'exec env -u SCCACHE_SERVER_UDS -u SCCACHE_SERVER_PORT SCCACHE_START_SERVER=0 SCCACHE_NO_AUTO_START_SERVER=1 /usr/local/libexec/sccache-client "$@"' \
            > "$shim_dir/sccache"
        else
          echo "Private runner lacks a canonical managed sccache client/endpoint (RUNNER_NAME=$RUNNER_NAME)" >&2
          exit 1
        fi
        chmod 0755 "$shim_dir/sccache"

        echo "Using managed private sccache transport: $transport"
        "$shim_dir/sccache" --version
        stats_json="$("$shim_dir/sccache" --show-stats --stats-format json)"
        baseline="$(printf '%s' "$stats_json" | node -e '
          let input = "";
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            const stats = JSON.parse(input).stats ?? {};
            process.stdout.write(`${stats.cache_read_errors ?? 0} ${stats.cache_write_errors ?? 0}`);
          });
        ')"
        read -r baseline_read baseline_write <<< "$baseline"
        {
          echo "$shim_dir"
        } >> "$GITHUB_PATH"
        {
          echo "CODEANDSOLDER_SCCACHE_BASE_READ_ERRORS=$baseline_read"
          echo "CODEANDSOLDER_SCCACHE_BASE_WRITE_ERRORS=$baseline_write"
          echo "RUSTC_WRAPPER=$shim_dir/sccache"
          echo "SCCACHE_BIN=$shim_dir/sccache"
          echo "CODEANDSOLDER_SCCACHE_MODE=private-local-garage"
          echo "CODEANDSOLDER_SCCACHE_TRANSPORT=$transport"
          echo "CODEANDSOLDER_SCCACHE_CACHE_HIT=system"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"
