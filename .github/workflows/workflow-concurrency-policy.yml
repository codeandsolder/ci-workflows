name: Shared workflow concurrency policy

on:
  pull_request:
    paths:
      - ".github/actions/workflow-concurrency-policy/**"
      - "policy-wasm/**"
      - ".github/pyproject.toml"
      - ".github/uv.lock"
      - ".github/workflows/**"
      - README.md
  push:
    branches: [main]
    paths:
      - ".github/actions/workflow-concurrency-policy/**"
      - "policy-wasm/**"
      - ".github/pyproject.toml"
      - ".github/uv.lock"
      - ".github/workflows/**"
      - README.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Check PR workflow cancellation
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify policy fixtures
        run: node policy-wasm/concurrency.test.mjs policy-wasm/module.json
      - name: Verify all shared CI workflows
        uses: ./.github/actions/workflow-concurrency-policy
