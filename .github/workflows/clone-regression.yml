name: Duplicate code regression

# Mandatory CI gate: no caller-controlled weakenable scan settings.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  clones:
    name: New duplicated code
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        github.event_name == 'merge_group'
      }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned shared implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions/clone-regression
            .github/scripts/run-clone-regression.sh
            .github/scripts/clone-regression-policy.py
          sparse-checkout-cone-mode: false

      - name: Compare duplication against base revision
        uses: ./.ci-workflows/.github/actions/clone-regression
        env:
          CLONE_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CLONE_GUARD_DISCOVERY_TOKENS: "50"
          CLONE_GUARD_BLOCKING_TOKENS: "100"
          CLONE_GUARD_TEST_BLOCKING_TOKENS: "140"
          CLONE_GUARD_LANGUAGES: ""
          CLONE_GUARD_SCAN_PATH: "."
          CLONE_GUARD_EXCLUDES: |
            .ci-workflows/**
            tests/**
            **/tests/**
            examples/**
            **/examples/**
            benches/**
            **/benches/**
            vendor/**
            **/vendor/**
            node_modules/**
            **/node_modules/**
            target/**
            **/target/**


      - name: Upload full clone findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doppelscan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/doppelscan-report.json
          retention-days: 7
          if-no-files-found: ignore
