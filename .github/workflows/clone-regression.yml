name: Duplicate code regression

# Mandatory CI gate: no caller-controlled weakenable scan settings.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  clones:
    name: New duplicated code
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        github.event_name == 'merge_group'
      }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned shared implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions/clone-regression
            .github/scripts/run-clone-regression.sh
            policy-wasm/run.mjs
            policy-wasm/workspace.mjs
            policy-wasm/module.mjs
            policy-wasm/module.json
            policy-wasm/module.wasm.gz
          sparse-checkout-cone-mode: false

      - name: Compare duplication against base revision
        uses: ./.ci-workflows/.github/actions/clone-regression
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          pr-head-sha: ${{ github.event.pull_request.head.sha || '' }}

      - name: Upload full clone findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doppelscan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/doppelscan-report.json
          retention-days: 7
          if-no-files-found: ignore
