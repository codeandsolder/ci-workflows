name: Shared Renovate policy invariants
on:
  pull_request:
    paths:
      - renovate.json
      - renovate-ci-trust-root.json
      - renovate-fleet.json
      - renovate-upstream-fork.json
      - renovate-native-automerge.json
      - scripts/native-renovate-automerge*.mjs
      - scripts/check-renovate-policy.cjs
      - .github/workflows/renovate-policy-check.yml
      - .github/workflows/renovate-config.yml
  push:
    branches: [main]
    paths:
      - renovate.json
      - renovate-ci-trust-root.json
      - renovate-fleet.json
      - renovate-upstream-fork.json
      - renovate-native-automerge.json
      - scripts/native-renovate-automerge*.mjs
      - scripts/check-renovate-policy.cjs
      - .github/workflows/renovate-policy-check.yml
      - .github/workflows/renovate-config.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out central policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shared Renovate invariants
        run: |
          node scripts/check-renovate-policy.cjs
          node --test scripts/native-renovate-automerge.test.mjs
  upstream-validator:
    uses: ./.github/workflows/renovate-config.yml
