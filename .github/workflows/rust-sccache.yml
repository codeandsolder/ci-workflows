name: Rust CI with mandatory sccache

on:
  workflow_call:
    inputs:
      prepare-command:
        description: Explicit prerequisites for strict scopes and tests; runs with managed cache before source policy when nonempty
        required: false
        type: string
        default: ""
      command:
        description: Additional non-overlapping validation after strict scopes and authoritative tests
        required: false
        type: string
        default: ""
      rust-toolchain:
        description: Explicit release compatibility toolchain, or the exact routine repository pin
        required: false
        default: ""
        type: string
      validation-tier:
        description: "routine (each PR/main) or release (only release tags); use release for MSRV and nonprimary OS/targets"
        required: false
        default: "routine"
        type: string
      uv-version:
        description: Exact uv version to provision for callers using independent Python reference tools; empty skips installation
        required: false
        default: ""
        type: string
      node-version:
        description: Explicit Node.js version for callers with JavaScript runtime tests; empty skips provisioning
        required: false
        default: ""
        type: string
      rust-components:
        description: Space-separated rustup components to install
        required: false
        default: ""
        type: string
      rust-targets:
        description: Space-separated rustup targets to install
        required: false
        default: ""
        type: string
      rustflags:
        description: "RUSTFLAGS for the caller; auto uses x86-64-v2 on X64 runners and no target-cpu override elsewhere"
        required: false
        default: "auto"
        type: string
      runner:
        description: GitHub-hosted runner used by public repositories
        required: false
        default: "ubuntu-24.04"
        type: string
      timeout-minutes:
        description: Job timeout
        required: false
        default: 90
        type: number
      cache-execution:
        description: Native compilation or public Linux cross-rs container compilation.
        required: false
        default: native
        type: string
      sccache-cache-scope:
        description: Stable cache workload override; defaults to caller command and target set
        required: false
        default: ""
        type: string
      sccache-cache-size-mib:
        description: Maximum persistent compiler cache size in MiB for public repositories
        required: false
        default: 6144
        type: number
      dependency-directories:
        description: Explicit JSON array of workspace paths for mandatory dependency scanning in a legacy non-strict Linux job; strict-suites already derive these automatically
        required: false
        type: string
        default: ""
      strict-suites:
        description: JSON array of named strict Rust scopes; one shared policy preflight and compiler lifecycle
        required: false
        default: ""
        type: string
      ban-python-outside-ci:
        description: Strict Rust policy rejects tracked non-CI Python by default
        required: false
        default: true
        type: boolean
      python-ci-paths:
        description: Additional CI-only Python path prefixes, one per line
        required: false
        default: ""
        type: string
      checkout-submodules:
        description: Submodule checkout mode (false, true, or recursive)
        required: false
        default: "false"
        type: string
      apt-packages:
        description: Space-separated Ubuntu build dependencies
        required: false
        default: ""
        type: string
      test-suites:
        description: JSON array of named authoritative unified Nextest scopes (empty runs only command)
        required: false
        default: ""
        type: string
      isolate-public-sccache-server:
        description: Give the public CI compiler cache an isolated Unix socket so test suites managing their own sccache daemon cannot stop it.
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Each job already has its own Cargo target. Retain coherent fingerprints,
  # build scripts, and dependency artifacts between Cargo commands in that
  # job; hosted runners are ephemeral and private runners clean after the job.
  # Do not override managed sccache, which remains the shared compiler cache.
  CARGO_BUILD_EPHEMERAL_INTERMEDIATES: "false"

jobs:
  rust:
    # Unknown values run into the validation step instead of silently skipping CI.
    if: ${{ inputs.validation-tier != 'release' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      RUST_COMPONENTS: ${{ inputs.rust-components }}
      RUST_TARGETS: ${{ inputs.rust-targets }}
      RUSTFLAGS: ${{ inputs.rustflags }}

    steps:
      - name: Validate requested CI tier
        shell: bash
        env:
          VALIDATION_TIER: ${{ inputs.validation-tier }}
          HAS_STRICT_SUITES: ${{ inputs.strict-suites != '' }}
          HAS_DEPENDENCY_DIRECTORIES: ${{ inputs.dependency-directories != '' }}
          CACHE_EXECUTION: ${{ inputs.cache-execution }}
        run: |
          case "$VALIDATION_TIER" in
            routine|release) ;;
            *) echo "Unknown validation-tier: $VALIDATION_TIER" >&2; exit 2 ;;
          esac
          if [[ "$HAS_STRICT_SUITES" == true && ( "$VALIDATION_TIER" != routine || "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 || "$CACHE_EXECUTION" != native ) ]]; then
            echo "Strict suites require routine native Linux X64 CI" >&2
            exit 2
          fi
          if [[ "$HAS_DEPENDENCY_DIRECTORIES" == true && ( "$HAS_STRICT_SUITES" == true || "$VALIDATION_TIER" != routine || "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 || "$CACHE_EXECUTION" != native ) ]]; then
            echo "Explicit dependency directories require a non-strict routine native Linux X64 job" >&2
            exit 2
          fi

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Git baseline SHA may be outside a PR's default shallow clone.
          fetch-depth: ${{ inputs.test-suites != '' && '0' || (inputs.strict-suites != '' && '2' || '1') }}
          submodules: ${{ inputs.checkout-submodules }}

      - name: Checkout shared CI implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions/rust-test-impact
            .github/actions/rust-strict-suites
            .github/actions/rust-dependency-quality
            .github/actions/workflow-concurrency-policy
            .github/actions/rust-ci-sccache-policy
            .github/actions/cargo-release-quarantine
            policy-wasm
            .github/actions/setup-sccache
            .github/actions/finalize-sccache
            .github/actions/resolve-rust-toolchain
          sparse-checkout-cone-mode: true

      - name: Checkout pinned strict Rust policy
        if: inputs.strict-suites != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codeandsolder/rust-skills2
          ref: cb9083676196a8ec3bf013e7253907b2759020c7 # main
          path: .rust-skills2-gate
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /rust-toolchain.toml
            /policy-wasm/check.mjs
            /policy-wasm/run.mjs
            /policy-wasm/module.mjs
            /policy-wasm/module.json
            /policy-wasm/module.wasm.gz
          sparse-checkout-cone-mode: false

      - name: Exclude injected CI checkout from caller Git packaging
        shell: bash
        run: |
          set -euo pipefail
          # The provider checkout is operational CI state, not caller source.
          # Without a local exclude, cargo package --locked rejects otherwise
          # clean repositories due to the injected untracked .ci-workflows/.
          # .git/info/exclude is local to this CI clone and never committed.
          printf '\n/.ci-workflows/\n/.rust-skills2-gate/\n' >> "$GITHUB_WORKSPACE/.git/info/exclude"
          if [[ -n "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard -- .ci-workflows .rust-skills2-gate)" ]]; then
            echo "Injected CI checkout is still visible as untracked source" >&2
            exit 1
          fi

      - name: Prepare strict Rust scopes
        if: inputs.strict-suites != ''
        id: strict-plan
        shell: bash
        env:
          STRICT_SUITES: ${{ inputs.strict-suites }}
        run: |
          set -euo pipefail
          node .ci-workflows/.github/actions/rust-strict-suites/run.mjs prepare
          printf 'strict-ref=%s\n' "$(git -C .rust-skills2-gate rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enforce tracked Python policy once
        if: inputs.strict-suites != ''
        uses: ./.rust-skills2-gate/.github/actions/python-strict
        with:
          ban-python-outside-ci: ${{ inputs.ban-python-outside-ci }}
          python-ci-paths: ${{ inputs.python-ci-paths }}

      - name: Enforce caller workflow cancellation once
        if: inputs.strict-suites != ''
        uses: ./.ci-workflows/.github/actions/workflow-concurrency-policy

      - name: Enforce canonical Rust cache lifecycle once
        if: inputs.strict-suites != ''
        uses: ./.ci-workflows/.github/actions/rust-ci-sccache-policy
        with:
          strict-ref: ${{ steps.strict-plan.outputs.strict-ref }}

      - name: Quarantine new external crates once across all workspaces
        if: inputs.strict-suites != '' && github.event_name == 'pull_request'
        uses: ./.ci-workflows/.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          lockfile: auto
          hours: "72"

      - name: Resolve one quarantined compiler
        id: compiler
        uses: ./.ci-workflows/.github/actions/resolve-rust-toolchain
        with:
          rust-toolchain: ${{ inputs.rust-toolchain }}
          validation-tier: ${{ inputs.validation-tier }}

      - name: Resolve portable RUSTFLAGS
        shell: bash
        env:
          REQUESTED_RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          set -euo pipefail
          effective="$REQUESTED_RUSTFLAGS"
          if [[ "$effective" == "auto" ]]; then
            case "$RUNNER_ARCH" in
              X64) effective="-C target-cpu=x86-64-v2" ;;
              *) effective="" ;;
            esac
          fi
          echo "RUSTFLAGS=$effective" >> "$GITHUB_ENV"

      - name: Install minimal Rust toolchain
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
          HAS_STRICT_SUITES: ${{ inputs.strict-suites != '' }}
        run: |
          set -euo pipefail
          if ! rustup run "$RUST_TOOLCHAIN" rustc --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          else
            echo "Rust toolchain $RUST_TOOLCHAIN is already installed on the runner."
          fi
          # The source checker reads the exact Clippy lint catalogue; fmt
          # needs rustfmt. Neither stage needs extra compilation targets.
          if [[ "$HAS_STRICT_SUITES" == true ]]; then
            rustup component add --toolchain "$RUST_TOOLCHAIN" clippy rustfmt
          fi

      - name: Configure runner-local Cargo target
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cargo-target"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: Strict formatting, source and release-license preflight
        id: strict-early
        if: inputs.strict-suites != '' && inputs.prepare-command == ''
        shell: bash
        env:
          STRICT_SUITES: ${{ inputs.strict-suites }}
          STRICT_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
        run: node .ci-workflows/.github/actions/rust-strict-suites/run.mjs preflight

      - name: Install remaining Rust components and targets
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
          VALIDATION_TIER: ${{ inputs.validation-tier }}
          HAS_TEST_SUITES: ${{ inputs.test-suites != '' }}
          HAS_STRICT_SUITES: ${{ inputs.strict-suites != '' }}
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_TIER" == routine || -n "$RUST_COMPONENTS" || "$HAS_TEST_SUITES" == true ]]; then
            read -r -a components <<< "$RUST_COMPONENTS"
            if [[ "$VALIDATION_TIER" == routine && "$HAS_STRICT_SUITES" != true ]]; then
              components+=(clippy rustfmt)
            fi
            if [[ "$HAS_TEST_SUITES" == true ]]; then
              components+=(llvm-tools-preview)
            fi
            # Rustup may schedule concurrent downloads for repeated components.
            # Pass each requested component exactly once.
            unique_components=()
            while IFS= read -r component; do
              [[ -n "$component" ]] || continue
              if [[ "$HAS_STRICT_SUITES" == true && ( "$component" == clippy || "$component" == rustfmt ) ]]; then
                continue
              fi
              unique_components+=("$component")
            done < <(printf '%s\n' "${components[@]}" | sort -u)
            if (( ${#unique_components[@]} )); then
              rustup component add --toolchain "$RUST_TOOLCHAIN" "${unique_components[@]}"
            fi
          fi

          # Rustup's native manifest may declare additional components/targets.
          # Honor it in routine jobs rather than treating workflow inputs as a
          # second, incomplete toolchain configuration.
          if [[ "$VALIDATION_TIER" == routine ]]; then
            rustup show active-toolchain
            test "$(rustc --version)" = "$(rustup run "$RUST_TOOLCHAIN" rustc --version)"
          fi

          if [[ -n "$RUST_TARGETS" ]]; then
            read -r -a targets <<< "$RUST_TARGETS"
            rustup target add --toolchain "$RUST_TOOLCHAIN" "${targets[@]}"
          fi

          rustc_path="$(rustup which rustc --toolchain "$RUST_TOOLCHAIN")"
          rustdoc_path="$(rustup which rustdoc --toolchain "$RUST_TOOLCHAIN")"
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
          } >> "$GITHUB_ENV"

          "$rustc_path" --version
          cargo +"$RUST_TOOLCHAIN" --version

      - name: Install native build dependencies
        if: inputs.apt-packages != ''
        shell: bash
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          sudo apt-get update
          read -r -a packages <<< "$PACKAGES"
          sudo apt-get install -y -- "${packages[@]}"

      - name: Isolate compiler cache daemon from test-managed sccache daemons
        if: ${{ inputs.isolate-public-sccache-server && !github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "An isolated Unix sccache socket is unavailable on Windows" >&2
            exit 2
          fi
          echo "SCCACHE_SERVER_UDS=$RUNNER_TEMP/ci-compiler-sccache.sock" >> "$GITHUB_ENV"

      - name: Setup mandatory sccache
        uses: ./.ci-workflows/.github/actions/setup-sccache
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          # Let setup derive its key from the resolved effective RUSTFLAGS.
          rustflags: ""
          cache-size-mib: ${{ inputs.sccache-cache-size-mib }}
          execution: ${{ inputs.cache-execution }}
          cache-scope: ${{ inputs.sccache-cache-scope || format('{0}:{1}:{2}{3}{4}', inputs.command, inputs.rust-targets, inputs.test-suites, inputs.strict-suites != '' && format(':{0}', inputs.strict-suites) || '', inputs.prepare-command != '' && format(':prepare:{0}', inputs.prepare-command) || '') }}

      - name: Provision explicitly requested uv
        if: ${{ inputs.uv-version != '' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: false

      - name: Provision explicitly requested Node.js
        if: ${{ inputs.node-version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Prepare explicit caller prerequisites
        if: inputs.prepare-command != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.prepare-command }}

      - name: Strict preflight after explicit caller preparation
        id: strict-late
        if: inputs.strict-suites != '' && inputs.prepare-command != ''
        shell: bash
        env:
          STRICT_SUITES: ${{ inputs.strict-suites }}
          STRICT_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
        run: node .ci-workflows/.github/actions/rust-strict-suites/run.mjs preflight

      - name: Start mandatory dependency scan alongside compilation
        id: dependency-scan
        if: inputs.dependency-directories != '' || (inputs.strict-suites != '' && (steps.strict-early.outputs.dependency-directories || steps.strict-late.outputs.dependency-directories) != '[]')
        uses: ./.ci-workflows/.github/actions/rust-dependency-quality
        with:
          mode: start
          working-directories: ${{ inputs.dependency-directories || steps.strict-early.outputs.dependency-directories || steps.strict-late.outputs.dependency-directories }}

      - name: Enforce all strict Rust lint scopes
        if: inputs.strict-suites != ''
        id: strict
        shell: bash
        env:
          STRICT_SUITES: ${{ inputs.strict-suites }}
          STRICT_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
          STRICT_PLAN_DIR: ${{ steps.strict-early.outputs.plan-dir || steps.strict-late.outputs.plan-dir }}
        run: node .ci-workflows/.github/actions/rust-strict-suites/run.mjs compile

      - name: Run unified authoritative Rust test suite
        if: inputs.test-suites != ''
        uses: ./.ci-workflows/.github/actions/rust-test-impact
        with:
          test-suites: ${{ inputs.test-suites }}

      - name: Run additional caller validation
        if: inputs.command != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.command }}

      - name: Collect mandatory dependency scan
        if: always() && steps.dependency-scan.outputs.scan-state != ''
        uses: ./.ci-workflows/.github/actions/rust-dependency-quality
        with:
          mode: finish
          scan-state: ${{ steps.dependency-scan.outputs.scan-state }}
          publish: ${{ job.status == 'success' }}

      - name: Finalize mandatory sccache
        if: always()
        uses: ./.ci-workflows/.github/actions/finalize-sccache
