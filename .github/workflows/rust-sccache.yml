name: Rust shared sccache

on:
  workflow_call:
    inputs:
      command:
        description: Rust/Cargo command to run in the caller repository
        required: true
        type: string
      rust-toolchain:
        description: Rust toolchain used for the caller command and sccache build
        required: false
        default: "1.98.1"
        type: string
      rust-components:
        description: Space-separated rustup components to install
        required: false
        default: ""
        type: string
      rust-targets:
        description: Space-separated rustup targets to install
        required: false
        default: ""
        type: string
      rustflags:
        description: RUSTFLAGS for the caller command
        required: false
        default: "-C target-cpu=x86-64-v2"
        type: string
      runner:
        description: GitHub-hosted runner label
        required: false
        default: "ubuntu-24.04"
        type: string
      distributed:
        description: Register this trusted runner as a direct sccache-dist worker and use the scheduler for cache misses
        required: false
        default: false
        type: boolean
    secrets:
      SCCACHE_S3_ACCESS_KEY_ID:
        required: false
      SCCACHE_S3_SECRET_ACCESS_KEY:
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAILSCALE_CLIENT_ID: "TUBzGLiWBZ11CNTRL-kRiRQY5Gto11CNTRL"
  TAILSCALE_AUDIENCE: "api.tailscale.com/TUBzGLiWBZ11CNTRL-kRiRQY5Gto11CNTRL"
  SCCACHE_FORK_REV: "9ea1b9a753906ffbc128ea57319e6ec0e14a2f43"
  SCCACHE_RELEASE_TAG: "sccache-ci-dist-9ea1b9a"
  SCCACHE_RELEASE_SHA256: "27139d236c88259188b8974ff3a5b05e8f4929829045934cf008687c368825fb"
  SCCACHE_DIST_RELEASE_SHA256: "b1e23087c8a2cde92ebce07a08b041788b7c853e365a88b763f156a145b616bf"
  SCCACHE_DIST_PORT: "10501"
  CARGO_EPHEMERAL_REV: "3e2509217ce5865c0fbe2b26534cb2cddcb8a48c"
  CARGO_EPHEMERAL_TAG: "cargo-ephemeral-ci-3e2509217-u22"
  CARGO_EPHEMERAL_SHA256: "3317623dfc56cb59fd69d66781a6cb4a75a2725472df730b1731fe0e121ae9ce"

jobs:
  rust:
    # Keep OIDC entirely out of ordinary PR jobs. A step-level guard is not
    # sufficient because id-token:write applies to every step in the job.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      RUST_COMPONENTS: ${{ inputs.rust-components }}
      RUST_TARGETS: ${{ inputs.rust-targets }}
      RUSTFLAGS: ${{ inputs.rustflags }}
      ENABLE_DISTRIBUTED: ${{ inputs.distributed }}
      CACHE_ACCESS_KEY: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
      CACHE_SECRET_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7

      - name: Restore persistent local sccache L0
        id: sccache-l0-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sccache-l0
          key: >-
            sccache-l0-canonical-v1-${{ runner.os }}-${{ runner.arch }}-
            ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-l0-canonical-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-

      - name: Show OIDC identity claims
        uses: actions/github-script@v8
        env:
          OIDC_AUDIENCE: ${{ env.TAILSCALE_AUDIENCE }}
        with:
          script: |
            const token = await core.getIDToken(process.env.OIDC_AUDIENCE);
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const keys = [
              'iss',
              'aud',
              'sub',
              'repository',
              'repository_id',
              'repository_owner',
              'repository_owner_id',
              'repository_visibility',
              'ref',
              'event_name',
              'workflow',
              'workflow_ref',
              'job_workflow_ref',
              'runner_environment'
            ];
            const selected = Object.fromEntries(
              keys.filter((key) => Object.hasOwn(payload, key))
                  .map((key) => [key, payload[key]])
            );
            console.log(JSON.stringify(selected, null, 2));

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TAILSCALE_CLIENT_ID }}
          audience: ${{ env.TAILSCALE_AUDIENCE }}
          tags: tag:sccache-worker
          ping: 100.65.0.2

      - name: Verify Garage ingress
        shell: bash
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/garage-probe.txt"
          code="$(curl --silent --show-error --connect-timeout 5             --output "$body" --write-out '%{http_code}'             http://100.65.0.2:3902/)"
          if [[ "$code" != "403" ]]; then
            echo "Expected Garage AccessDenied (HTTP 403), got HTTP $code" >&2
            cat "$body" >&2
            exit 1
          fi

      - name: Fetch shared-cache credentials over tailnet
        id: cache-broker
        shell: bash
        run: |
          set -euo pipefail
          broker_url="http://100.65.0.2:3903/v1/sccache-credentials"
          response_file="${RUNNER_TEMP}/sccache-credentials.json"

          if curl --fail --silent --show-error --connect-timeout 3             --output "$response_file" "$broker_url"; then
            access_key="$(jq -er '.access_key_id' "$response_file")"
            secret_key="$(jq -er '.secret_access_key' "$response_file")"
            endpoint="$(jq -er '.endpoint' "$response_file")"
            bucket="$(jq -er '.bucket' "$response_file")"
            region="$(jq -er '.region' "$response_file")"
            key_prefix="$(jq -er '.key_prefix' "$response_file")"
            scheduler_url="$(jq -r '.scheduler_url // empty' "$response_file")"
            scheduler_token="$(jq -r '.scheduler_token // empty' "$response_file")"

            echo "::add-mask::$access_key"
            echo "::add-mask::$secret_key"
            if [[ -n "$scheduler_token" ]]; then
              echo "::add-mask::$scheduler_token"
            fi
            {
              echo "CACHE_ACCESS_KEY=$access_key"
              echo "CACHE_SECRET_KEY=$secret_key"
              echo "CACHE_ENDPOINT=$endpoint"
              echo "CACHE_BUCKET=$bucket"
              echo "CACHE_REGION=$region"
              echo "CACHE_KEY_PREFIX=$key_prefix"
              echo "DIST_SCHEDULER_URL=$scheduler_url"
              echo "DIST_SCHEDULER_TOKEN=$scheduler_token"
            } >> "$GITHUB_ENV"
            echo "source=tailnet-broker" >> "$GITHUB_OUTPUT"
            rm -f "$response_file"
          else
            rm -f "$response_file"
            echo "Tailnet credential broker unavailable; falling back to caller secrets if configured."
            echo "source=caller-secrets" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect shared-cache credentials
        id: cache-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CACHE_ACCESS_KEY:-}" && -n "${CACHE_SECRET_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "${CACHE_ACCESS_KEY:-}" && -z "${CACHE_SECRET_KEY:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Garage credentials are not configured; running without shared sccache."
          else
            echo "Only one Garage credential is configured; both are required." >&2
            exit 1
          fi

          if [[ "$ENABLE_DISTRIBUTED" == "true" ]]; then
            if [[ -z "${DIST_SCHEDULER_URL:-}" || -z "${DIST_SCHEDULER_TOKEN:-}" ]]; then
              echo "Distributed mode requested but scheduler credentials are unavailable." >&2
              exit 1
            fi
            echo "dist_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

          if [[ -n "$RUST_COMPONENTS" ]]; then
            read -r -a components <<< "$RUST_COMPONENTS"
            rustup component add --toolchain "$RUST_TOOLCHAIN" "${components[@]}"
          fi

          if [[ -n "$RUST_TARGETS" ]]; then
            read -r -a targets <<< "$RUST_TARGETS"
            rustup target add --toolchain "$RUST_TOOLCHAIN" "${targets[@]}"
          fi

          rustc_path="$(rustup which rustc --toolchain "$RUST_TOOLCHAIN")"
          rustdoc_path="$(rustup which rustdoc --toolchain "$RUST_TOOLCHAIN")"
          {
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
          } >> "$GITHUB_ENV"

          "$rustc_path" --version
          cargo +"$RUST_TOOLCHAIN" --version

      - name: Install canonical sccache client and direct worker
        if: steps.cache-config.outputs.enabled == 'true' || steps.cache-config.outputs.dist_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          sccache_bin="$HOME/.local/bin/sccache"
          sccache_dist_bin="$HOME/.local/bin/sccache-dist"

          curl --fail --location --silent --show-error \
            "https://github.com/codeandsolder/sccache-deduplicated/releases/download/$SCCACHE_RELEASE_TAG/sccache-linux-x86_64-v2" \
            --output "$sccache_bin"
          curl --fail --location --silent --show-error \
            "https://github.com/codeandsolder/sccache-deduplicated/releases/download/$SCCACHE_RELEASE_TAG/sccache-dist-linux-x86_64-v2" \
            --output "$sccache_dist_bin"

          printf '%s  %s\n' "$SCCACHE_RELEASE_SHA256" "$sccache_bin" | sha256sum --check
          printf '%s  %s\n' "$SCCACHE_DIST_RELEASE_SHA256" "$sccache_dist_bin" | sha256sum --check
          chmod 0755 "$sccache_bin" "$sccache_dist_bin"

          if [[ ! -x /usr/bin/bwrap ]]; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi

          # Ubuntu 24.04 enables AppArmor's unprivileged-userns restriction.
          # Canonical Rust paths use bubblewrap mount namespaces, so trusted
          # GitHub-hosted jobs need user namespaces enabled for this ephemeral VM.
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] \
             && [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          # Fail here with a useful platform error rather than deep inside rustc
          # discovery after sccache has started.
          /usr/bin/bwrap --ro-bind / / /bin/true

          "$sccache_bin" --version
          if [[ "${ENABLE_DISTRIBUTED}" == "true" ]]; then
            "$sccache_dist_bin" --version
          fi

      - name: Install maintained Cargo client
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$HOME/.local/libexec"
          wrapper_dir="$HOME/.local/bin"
          mkdir -p "$install_dir" "$wrapper_dir" "$RUNNER_TEMP/cargo-source"

          cargo_bin="$install_dir/cargo-ephemeral"
          curl --fail --location --silent --show-error \
            "https://github.com/codeandsolder/cargo-ephemeral/releases/download/$CARGO_EPHEMERAL_TAG/cargo-ephemeral-linux-x86_64" \
            --output "$cargo_bin"

          printf '%s  %s\n' "$CARGO_EPHEMERAL_SHA256" "$cargo_bin" | sha256sum --check
          chmod 0755 "$cargo_bin"

          cat > "$wrapper_dir/cargo" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${1:-}" == +* ]]; then
            export RUSTUP_TOOLCHAIN="${1#+}"
            shift
          fi

          export EPHEMERAL_CARGO_REGISTRY_SRC="${EPHEMERAL_CARGO_REGISTRY_SRC:-${RUNNER_TEMP:?}/cargo-source}"
          export EPHEMERAL_CARGO_WRAPPER="$0"

          exec "$HOME/.local/libexec/cargo-ephemeral" "$@"
          EOF
          chmod 0755 "$wrapper_dir/cargo"

          {
            echo "PATH=$wrapper_dir:$PATH"
            echo "EPHEMERAL_CARGO_REGISTRY_SRC=$RUNNER_TEMP/cargo-source"
            echo "EPHEMERAL_CARGO_WRAPPER=$wrapper_dir/cargo"
          } >> "$GITHUB_ENV"

          version="$("$wrapper_dir/cargo" --version)"
          echo "$version"
          [[ "$version" == *"${CARGO_EPHEMERAL_REV:0:9}"* ]]

      - name: Configure runner-local Cargo target
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cargo-target"
          target_tmp="$target_dir/.tmp"
          mkdir -p "$target_dir" "$target_tmp"
          {
            echo "CARGO_TARGET_DIR=$target_dir"
            echo "CARGO_TARGET_TMPDIR=$target_tmp"
            echo "SCCACHE_CANONICAL_TARGET_ROOT=$target_dir"
          } >> "$GITHUB_ENV"

      - name: Configure distributed sccache client
        if: steps.cache-config.outputs.dist_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          client_cache="$RUNNER_TEMP/sccache-dist-client"
          client_config="$RUNNER_TEMP/sccache-client.toml"
          mkdir -p "$client_cache"

          cat > "$client_config" <<EOF
          [dist]
          scheduler_url = "$DIST_SCHEDULER_URL"
          toolchains = []
          toolchain_cache_size = 2147483648
          cache_dir = "$client_cache"

          [dist.auth]
          type = "token"
          token = "$DIST_SCHEDULER_TOKEN"
          EOF
          chmod 0600 "$client_config"
          echo "SCCACHE_CONF=$client_config" >> "$GITHUB_ENV"

      - name: Start direct sccache-dist worker
        if: steps.cache-config.outputs.dist_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ts_ip="$(tailscale ip -4 | head -n1)"
          [[ -n "$ts_ip" ]]

          worker_cache="$RUNNER_TEMP/sccache-dist-worker-toolchains"
          worker_build="$RUNNER_TEMP/sccache-dist-worker-build"
          worker_config="$RUNNER_TEMP/sccache-dist-worker.toml"
          worker_log="$RUNNER_TEMP/sccache-dist-worker.log"
          worker_pidfile="$RUNNER_TEMP/sccache-dist-worker.pid"
          mkdir -p "$worker_cache" "$worker_build"

          cat > "$worker_config" <<EOF
          cache_dir = "$worker_cache"
          toolchain_cache_size = 4294967296
          public_addr = "$ts_ip:$SCCACHE_DIST_PORT"
          bind_address = "$ts_ip:$SCCACHE_DIST_PORT"
          scheduler_url = "$DIST_SCHEDULER_URL"

          [builder]
          type = "overlay"
          build_dir = "$worker_build"
          bwrap_path = "/usr/bin/bwrap"

          [scheduler_auth]
          type = "DANGEROUSLY_INSECURE"
          EOF

          sudo sh -c '
            echo $ > "$1"
            exec env SCCACHE_NO_DAEMON=1 SCCACHE_LOG=info "$2" server --config "$3"
          ' sh "$worker_pidfile" "$HOME/.local/bin/sccache-dist" "$worker_config" \
            >"$worker_log" 2>&1 &

          for _ in {1..30}; do
            if [[ -s "$worker_pidfile" ]] && sudo kill -0 "$(cat "$worker_pidfile")" 2>/dev/null; then
              if timeout 1 bash -c "</dev/tcp/$ts_ip/$SCCACHE_DIST_PORT" 2>/dev/null; then
                echo "direct sccache-dist worker listening at $ts_ip:$SCCACHE_DIST_PORT"
                break
              fi
            elif [[ -s "$worker_pidfile" ]]; then
              cat "$worker_log" >&2 || true
              exit 1
            fi
            sleep 1
          done

          if ! timeout 1 bash -c "</dev/tcp/$ts_ip/$SCCACHE_DIST_PORT" 2>/dev/null; then
            cat "$worker_log" >&2 || true
            echo "direct sccache-dist worker did not become reachable" >&2
            exit 1
          fi

      - name: Configure shared sccache
        if: steps.cache-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PATH=$HOME/.local/bin:$PATH"
            echo "RUSTC_WRAPPER=$HOME/.local/bin/sccache"
            echo "SCCACHE_EXPERIMENTAL_CANONICAL_RUST=1"
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache-l0"
            echo "SCCACHE_CACHE_SIZE=1G"
            echo "SCCACHE_MULTILEVEL_CHAIN=disk,s3"
            echo "SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=l0"
            echo "SCCACHE_BUCKET=${CACHE_BUCKET:-sccache}"
            echo "SCCACHE_REGION=${CACHE_REGION:-garage-jlc}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT:-http://100.65.0.2:3902}"
            echo "SCCACHE_S3_USE_SSL=false"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX:-rust/}"
            echo "AWS_ACCESS_KEY_ID=$CACHE_ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$CACHE_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Start sccache
        if: steps.cache-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/sccache" --start-server
          "$HOME/.local/bin/sccache" --zero-stats
          if [[ "$ENABLE_DISTRIBUTED" == "true" ]]; then
            "$HOME/.local/bin/sccache" --dist-status
          fi

      - name: Run caller command
        shell: bash
        run: ${{ inputs.command }}

      - name: Show shared-cache stats
        if: always() && steps.cache-config.outputs.enabled == 'true'
        shell: bash
        run: |
          "$HOME/.local/bin/sccache" --show-stats || true
          # L1 writes may complete after rustc returns. Give the ephemeral
          # runner a small drain window before GitHub tears the process down.
          sleep 5
          "$HOME/.local/bin/sccache" --show-stats || true

      - name: Stop sccache before persisting L0
        if: always() && steps.cache-config.outputs.enabled == 'true'
        shell: bash
        run: |
          "$HOME/.local/bin/sccache" --stop-server || true

      - name: Save updated local sccache L0
        if: always() && steps.cache-config.outputs.enabled == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache-l0
          key: ${{ steps.sccache-l0-restore.outputs.cache-primary-key }}

      - name: Stop direct sccache-dist worker
        if: always() && steps.cache-config.outputs.dist_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker_pidfile="$RUNNER_TEMP/sccache-dist-worker.pid"
          worker_log="$RUNNER_TEMP/sccache-dist-worker.log"
          if [[ -s "$worker_pidfile" ]]; then
            pid="$(cat "$worker_pidfile")"
            sudo kill "$pid" 2>/dev/null || true
            for _ in {1..10}; do
              sudo kill -0 "$pid" 2>/dev/null || break
              sleep 0.2
            done
            sudo kill -KILL "$pid" 2>/dev/null || true
          fi
          tail -n 80 "$worker_log" 2>/dev/null || true
