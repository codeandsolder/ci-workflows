name: Rust CI with mandatory sccache

on:
  workflow_call:
    inputs:
      command:
        description: Rust/Cargo command to run in the caller repository
        required: true
        type: string
      rust-toolchain:
        description: Rust toolchain used for the caller command
        required: false
        default: "1.99.1"
        type: string
      validation-tier:
        description: "routine (each PR/main) or release (only release tags); use release for MSRV and nonprimary OS/targets"
        required: false
        default: "routine"
        type: string
      rust-components:
        description: Space-separated rustup components to install
        required: false
        default: ""
        type: string
      rust-targets:
        description: Space-separated rustup targets to install
        required: false
        default: ""
        type: string
      rustflags:
        description: "RUSTFLAGS for the caller; auto uses x86-64-v2 on X64 runners and no target-cpu override elsewhere"
        required: false
        default: "auto"
        type: string
      runner:
        description: GitHub-hosted runner used by public repositories
        required: false
        default: "ubuntu-24.04"
        type: string
      timeout-minutes:
        description: Job timeout
        required: false
        default: 90
        type: number
      sccache-cache-size-mib:
        description: Maximum persistent compiler cache size in MiB for public repositories
        required: false
        default: 6144
        type: number
      isolate-public-sccache-server:
        description: Give the public CI compiler cache an isolated Unix socket so test suites managing their own sccache daemon cannot stop it.
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    # Unknown values run into the validation step instead of silently skipping CI.
    if: ${{ inputs.validation-tier != 'release' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64"]') || inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      RUST_COMPONENTS: ${{ inputs.rust-components }}
      RUST_TARGETS: ${{ inputs.rust-targets }}
      RUSTFLAGS: ${{ inputs.rustflags }}

    steps:
      - name: Validate requested CI tier
        shell: bash
        env:
          VALIDATION_TIER: ${{ inputs.validation-tier }}
        run: |
          case "$VALIDATION_TIER" in
            routine|release) ;;
            *) echo "Unknown validation-tier: $VALIDATION_TIER" >&2; exit 2 ;;
          esac

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout shared CI implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-sccache
            .github/actions/finalize-sccache
          sparse-checkout-cone-mode: true

      - name: Exclude injected CI checkout from caller Git packaging
        shell: bash
        run: |
          set -euo pipefail
          # The provider checkout is operational CI state, not caller source.
          # Without a local exclude, cargo package --locked rejects otherwise
          # clean repositories due to the injected untracked .ci-workflows/.
          # .git/info/exclude is local to this CI clone and never committed.
          printf '\n/.ci-workflows/\n' >> "$GITHUB_WORKSPACE/.git/info/exclude"
          if [[ -n "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard -- .ci-workflows)" ]]; then
            echo "Injected CI checkout is still visible as untracked source" >&2
            exit 1
          fi

      - name: Resolve portable RUSTFLAGS
        shell: bash
        env:
          REQUESTED_RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          set -euo pipefail
          effective="$REQUESTED_RUSTFLAGS"
          if [[ "$effective" == "auto" ]]; then
            case "$RUNNER_ARCH" in
              X64) effective="-C target-cpu=x86-64-v2" ;;
              *) effective="" ;;
            esac
          fi
          echo "RUSTFLAGS=$effective" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup run "$RUST_TOOLCHAIN" rustc --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          else
            echo "Rust toolchain $RUST_TOOLCHAIN is already installed on the runner."
          fi

          if [[ -n "$RUST_COMPONENTS" ]]; then
            read -r -a components <<< "$RUST_COMPONENTS"
            rustup component add --toolchain "$RUST_TOOLCHAIN" "${components[@]}"
          fi

          if [[ -n "$RUST_TARGETS" ]]; then
            read -r -a targets <<< "$RUST_TARGETS"
            rustup target add --toolchain "$RUST_TOOLCHAIN" "${targets[@]}"
          fi

          rustc_path="$(rustup which rustc --toolchain "$RUST_TOOLCHAIN")"
          rustdoc_path="$(rustup which rustdoc --toolchain "$RUST_TOOLCHAIN")"
          {
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
          } >> "$GITHUB_ENV"

          "$rustc_path" --version
          cargo +"$RUST_TOOLCHAIN" --version

      - name: Isolate compiler cache daemon from test-managed sccache daemons
        if: ${{ inputs.isolate-public-sccache-server && !github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "An isolated Unix sccache socket is unavailable on Windows" >&2
            exit 2
          fi
          echo "SCCACHE_SERVER_UDS=$RUNNER_TEMP/ci-compiler-sccache.sock" >> "$GITHUB_ENV"

      - name: Setup mandatory sccache
        uses: ./.ci-workflows/.github/actions/setup-sccache
        with:
          rust-toolchain: ${{ inputs.rust-toolchain }}
          # Let setup derive its key from the resolved effective RUSTFLAGS.
          rustflags: ""
          cache-size-mib: ${{ inputs.sccache-cache-size-mib }}

      - name: Configure runner-local Cargo target
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cargo-target"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: Run caller command
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.command }}

      - name: Finalize mandatory sccache
        if: always()
        uses: ./.ci-workflows/.github/actions/finalize-sccache
