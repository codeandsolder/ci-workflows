name: Rust shared sccache

on:
  workflow_call:
    inputs:
      command:
        description: Rust/Cargo command to run in the caller repository
        required: false
        default: ""
        type: string
      rust-toolchain:
        description: Rust toolchain used for the caller command
        required: false
        default: "1.99.0"
        type: string
      rust-components:
        description: Space-separated rustup components to install
        required: false
        default: ""
        type: string
      rust-targets:
        description: Space-separated rustup targets to install
        required: false
        default: ""
        type: string
      rustflags:
        description: RUSTFLAGS for the caller command
        required: false
        default: "-C target-cpu=x86-64-v2"
        type: string
      runner:
        description: GitHub-hosted runner label
        required: false
        default: "ubuntu-24.04"
        type: string
      ephemeral-cargo:
        description: Use the maintained Cargo client for registry-source normalization
        required: false
        default: true
        type: boolean
      canonical-rust:
        description: Canonicalize Rust build/source paths for cache-key reuse across runners
        required: false
        default: true
        type: boolean
      timeout-minutes:
        description: Job timeout
        required: false
        default: 90
        type: number

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ACTIONS_CACHE_SERVICE_V2: on
  SCCACHE_FORK_REV: "d1d0d542d3775a190c84d4cf051e0ebe6c52f0cb"
  SCCACHE_RELEASE_TAG: "sccache-ci-d1d0d542d3775a190c84d4cf051e0ebe6c52f0cb"
  SCCACHE_RELEASE_SHA256: "24641b86265eb84f90911a40507356e45673d1c1c338b853909ee8659f657a5b"
  SCCACHE_CACHE_LAYOUT_ID: "rust-v7-layout2"
  CARGO_EPHEMERAL_REV: "3e2509217ce5865c0fbe2b26534cb2cddcb8a48c"
  CARGO_EPHEMERAL_TAG: "cargo-ephemeral-ci-3e2509217-u22"
  CARGO_EPHEMERAL_SHA256: "3317623dfc56cb59fd69d66781a6cb4a75a2725472df730b1731fe0e121ae9ce"

jobs:
  rust:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      RUST_COMPONENTS: ${{ inputs.rust-components }}
      RUST_TARGETS: ${{ inputs.rust-targets }}
      RUSTFLAGS: ${{ inputs.rustflags }}
      ENABLE_CANONICAL_RUST: ${{ inputs.canonical-rust }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup run "$RUST_TOOLCHAIN" rustc --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          else
            echo "Rust toolchain $RUST_TOOLCHAIN is already installed on the runner."
          fi

          if [[ -n "$RUST_COMPONENTS" ]]; then
            read -r -a components <<< "$RUST_COMPONENTS"
            rustup component add --toolchain "$RUST_TOOLCHAIN" "${components[@]}"
          fi

          if [[ -n "$RUST_TARGETS" ]]; then
            read -r -a targets <<< "$RUST_TARGETS"
            rustup target add --toolchain "$RUST_TOOLCHAIN" "${targets[@]}"
          fi

          rustc_path="$(rustup which rustc --toolchain "$RUST_TOOLCHAIN")"
          rustdoc_path="$(rustup which rustdoc --toolchain "$RUST_TOOLCHAIN")"
          {
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
          } >> "$GITHUB_ENV"

          "$rustc_path" --version
          cargo +"$RUST_TOOLCHAIN" --version

      - name: Restore immutable build-client bundle
        id: build-clients-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shared-build-clients
          key: shared-build-clients-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_RELEASE_SHA256 }}-${{ env.CARGO_EPHEMERAL_SHA256 }}

      - name: Populate immutable build-client bundle
        if: steps.build-clients-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/shared-build-clients"
          mkdir -p "$bundle"

          curl --fail --location --silent --show-error             "https://github.com/codeandsolder/sccache-deduplicated/releases/download/$SCCACHE_RELEASE_TAG/sccache-linux-x86_64-v2"             --output "$bundle/sccache" &
          p1=$!
          curl --fail --location --silent --show-error             "https://github.com/codeandsolder/cargo-ephemeral/releases/download/$CARGO_EPHEMERAL_TAG/cargo-ephemeral-linux-x86_64"             --output "$bundle/cargo-ephemeral" &
          p2=$!
          wait "$p1" "$p2"

          printf '%s  %s\n' "$SCCACHE_RELEASE_SHA256" "$bundle/sccache" | sha256sum --check
          printf '%s  %s\n' "$CARGO_EPHEMERAL_SHA256" "$bundle/cargo-ephemeral" | sha256sum --check
          chmod 0755 "$bundle/sccache" "$bundle/cargo-ephemeral"

      - name: Save immutable build-client bundle
        if: steps.build-clients-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shared-build-clients
          key: ${{ steps.build-clients-cache.outputs.cache-primary-key }}

      - name: Install canonical sccache client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          sccache_bin="$HOME/.local/bin/sccache"
          install -m 0755 "$RUNNER_TEMP/shared-build-clients/sccache" "$sccache_bin"

          if [[ "$ENABLE_CANONICAL_RUST" == "true" ]]; then
            if [[ ! -x /usr/bin/bwrap ]]; then
              sudo apt-get update
              sudo apt-get install --yes bubblewrap
            fi

            if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]                && [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi

            /usr/bin/bwrap --ro-bind / / /bin/true
          fi

          "$sccache_bin" --version

      - name: Install maintained Cargo client
        if: inputs.ephemeral-cargo
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$HOME/.local/libexec"
          wrapper_dir="$HOME/.local/bin"
          mkdir -p             "$install_dir"             "$wrapper_dir"             "$RUNNER_TEMP/cargo-source"             "$HOME/.cargo/registry/src"

          cargo_bin="$install_dir/cargo-ephemeral"
          install -m 0755 "$RUNNER_TEMP/shared-build-clients/cargo-ephemeral" "$cargo_bin"

          cat > "$wrapper_dir/cargo" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${1:-}" == +* ]]; then
            export RUSTUP_TOOLCHAIN="${1#+}"
            shift
          fi

          export EPHEMERAL_CARGO_REGISTRY_SRC="${EPHEMERAL_CARGO_REGISTRY_SRC:-${RUNNER_TEMP:?}/cargo-source}"
          export EPHEMERAL_CARGO_WRAPPER="$0"

          exec "$HOME/.local/libexec/cargo-ephemeral" "$@"
          EOF
          chmod 0755 "$wrapper_dir/cargo"

          {
            echo "PATH=$wrapper_dir:$PATH"
            echo "EPHEMERAL_CARGO_REGISTRY_SRC=$RUNNER_TEMP/cargo-source"
            echo "EPHEMERAL_CARGO_WRAPPER=$wrapper_dir/cargo"
          } >> "$GITHUB_ENV"

          version="$("$wrapper_dir/cargo" --version)"
          echo "$version"
          [[ "$version" == *"${CARGO_EPHEMERAL_REV:0:9}"* ]]

      - name: Configure runner-local Cargo target
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cargo-target"
          target_tmp="$target_dir/.tmp"
          mkdir -p "$target_dir" "$target_tmp"
          {
            echo "CARGO_TARGET_DIR=$target_dir"
            echo "CARGO_TARGET_TMPDIR=$target_tmp"
            echo "SCCACHE_CANONICAL_TARGET_ROOT=$target_dir"
          } >> "$GITHUB_ENV"

      - name: Expose GitHub Actions cache runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure GitHub Actions sccache backend
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ACTIONS_RESULTS_URL:-}" ]]
          [[ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]
          {
            echo "PATH=$HOME/.local/bin:$PATH"
            echo "RUSTC_WRAPPER=$HOME/.local/bin/sccache"
            echo "SCCACHE_GHA_ENABLED=on"
            echo "SCCACHE_GHA_VERSION=$SCCACHE_CACHE_LAYOUT_ID"
            if [[ "$ENABLE_CANONICAL_RUST" == "true" ]]; then
              echo "SCCACHE_EXPERIMENTAL_CANONICAL_RUST=1"
            fi
          } >> "$GITHUB_ENV"

      - name: Start sccache
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/sccache" --start-server
          "$HOME/.local/bin/sccache" --zero-stats

      - name: Run caller command
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.command != '' }}" != "true" ]]; then
            echo "command is required" >&2
            exit 1
          fi
          ${{ inputs.command }}

      - name: Check sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stats_json="$("$HOME/.local/bin/sccache" --show-stats --stats-format json)"
          "$HOME/.local/bin/sccache" --show-stats
          read_errors="$(jq -r '.stats.cache_read_errors' <<< "$stats_json")"
          write_errors="$(jq -r '.stats.cache_write_errors' <<< "$stats_json")"
          if (( read_errors != 0 || write_errors != 0 )); then
            echo "sccache backend errors: read=$read_errors write=$write_errors" >&2
            exit 1
          fi

      - name: Stop sccache
        if: always()
        shell: bash
        run: |
          "$HOME/.local/bin/sccache" --stop-server || true
