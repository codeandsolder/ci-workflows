name: Rust runner-local sccache

on:
  workflow_call:
    inputs:
      command:
        description: Rust/Cargo command to run in the caller repository
        required: false
        default: ""
        type: string
      rust-toolchain:
        description: Rust toolchain used for the caller command
        required: false
        default: "1.99.0"
        type: string
      rust-components:
        description: Space-separated rustup components to install
        required: false
        default: ""
        type: string
      rust-targets:
        description: Space-separated rustup targets to install
        required: false
        default: ""
        type: string
      rustflags:
        description: RUSTFLAGS for the caller command
        required: false
        default: "-C target-cpu=x86-64-v2"
        type: string
      runner:
        description: GitHub-hosted runner label
        required: false
        default: "ubuntu-24.04"
        type: string
      timeout-minutes:
        description: Job timeout
        required: false
        default: 90
        type: number

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_FORK_REV: "d1d0d542d3775a190c84d4cf051e0ebe6c52f0cb"
  SCCACHE_RELEASE_TAG: "sccache-ci-d1d0d542d3775a190c84d4cf051e0ebe6c52f0cb"
  SCCACHE_RELEASE_SHA256: "24641b86265eb84f90911a40507356e45673d1c1c338b853909ee8659f657a5b"

jobs:
  rust:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      RUST_COMPONENTS: ${{ inputs.rust-components }}
      RUST_TARGETS: ${{ inputs.rust-targets }}
      RUSTFLAGS: ${{ inputs.rustflags }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup run "$RUST_TOOLCHAIN" rustc --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          else
            echo "Rust toolchain $RUST_TOOLCHAIN is already installed on the runner."
          fi

          if [[ -n "$RUST_COMPONENTS" ]]; then
            read -r -a components <<< "$RUST_COMPONENTS"
            rustup component add --toolchain "$RUST_TOOLCHAIN" "${components[@]}"
          fi

          if [[ -n "$RUST_TARGETS" ]]; then
            read -r -a targets <<< "$RUST_TARGETS"
            rustup target add --toolchain "$RUST_TOOLCHAIN" "${targets[@]}"
          fi

          rustc_path="$(rustup which rustc --toolchain "$RUST_TOOLCHAIN")"
          rustdoc_path="$(rustup which rustdoc --toolchain "$RUST_TOOLCHAIN")"
          {
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
          } >> "$GITHUB_ENV"

          "$rustc_path" --version
          cargo +"$RUST_TOOLCHAIN" --version

      - name: Restore immutable build-client bundle
        id: build-clients-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shared-build-clients
          key: shared-build-clients-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_RELEASE_SHA256 }}

      - name: Populate immutable build-client bundle
        if: steps.build-clients-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/shared-build-clients"
          mkdir -p "$bundle"
          curl --fail --location --silent --show-error \
            "https://github.com/codeandsolder/sccache-deduplicated/releases/download/$SCCACHE_RELEASE_TAG/sccache-linux-x86_64-v2" \
            --output "$bundle/sccache"
          printf '%s  %s\n' "$SCCACHE_RELEASE_SHA256" "$bundle/sccache" | sha256sum --check
          chmod 0755 "$bundle/sccache"

      - name: Save immutable build-client bundle
        if: steps.build-clients-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shared-build-clients
          key: ${{ steps.build-clients-cache.outputs.cache-primary-key }}

      - name: Install sccache client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/shared-build-clients/sccache" "$HOME/.local/bin/sccache"
          "$HOME/.local/bin/sccache" --version

      - name: Configure runner-local Cargo target
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cargo-target"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: Configure runner-local sccache
        shell: bash
        run: |
          set -euo pipefail
          sccache_dir="$RUNNER_TEMP/sccache"
          mkdir -p "$sccache_dir"
          {
            echo "PATH=$HOME/.local/bin:$PATH"
            echo "RUSTC_WRAPPER=$HOME/.local/bin/sccache"
            echo "SCCACHE_DIR=$sccache_dir"
          } >> "$GITHUB_ENV"

      - name: Start sccache
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/sccache" --start-server
          "$HOME/.local/bin/sccache" --zero-stats

      - name: Run caller command
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.command != '' }}" != "true" ]]; then
            echo "command is required" >&2
            exit 1
          fi
          ${{ inputs.command }}

      - name: Check sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stats_json="$("$HOME/.local/bin/sccache" --show-stats --stats-format json)"
          "$HOME/.local/bin/sccache" --show-stats
          read_errors="$(jq -r '.stats.cache_read_errors' <<< "$stats_json")"
          write_errors="$(jq -r '.stats.cache_write_errors' <<< "$stats_json")"
          if (( read_errors != 0 || write_errors != 0 )); then
            echo "sccache backend errors: read=$read_errors write=$write_errors" >&2
            exit 1
          fi

      - name: Stop sccache
        if: always()
        shell: bash
        run: |
          "$HOME/.local/bin/sccache" --stop-server || true
