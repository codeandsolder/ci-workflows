name: Runner availability tests
on:
  pull_request:
    paths:
      - "scripts/fleet-scope.mjs"
      - scripts/runner-availability*.mjs
      - policy-wasm/src/runner_admission.rs
      - policy-wasm/bridge.mjs
      - .github/workflows/runner-availability-test.yml
  push:
    branches: [main]
    paths:
      - "scripts/fleet-scope.mjs"
      - scripts/runner-availability*.mjs
      - policy-wasm/src/runner_admission.rs
      - policy-wasm/bridge.mjs
      - .github/workflows/runner-availability-test.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test scripts/runner-availability.test.mjs
