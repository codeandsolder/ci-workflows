name: Source quality module smoke

on:
  pull_request:
    paths:
      - languages/**
      - "**/*.java"
      - "scripts/**/*.mjs"
      - "scripts/**/*.cjs"
      - ".github/actions/install-rust-toolchain/**"
      - .github/actions/**/*.sh
      - .github/actions/**/*.bash
      - .github/actions/**/*.js
      - .github/actions/**/*.mjs
      - .github/actions/**/*.cjs
      - .github/actions/**/*.ts
      - .github/actions/**/*.wgsl
      - .github/actions/detect-languages/**
      - .github/actions/shell-quality/**
      - .github/actions/javascript-quality/**
      - .github/actions/setup-sccache/**
      - .github/actions/finalize-sccache/**
      - .github/workflows/source-quality*.yml
  push:
    branches: [main]
    paths:
      - languages/**
      - "**/*.java"
      - "scripts/**/*.mjs"
      - "scripts/**/*.cjs"
      - ".github/actions/install-rust-toolchain/**"
      - .github/actions/**/*.sh
      - .github/actions/**/*.bash
      - .github/actions/**/*.js
      - .github/actions/**/*.mjs
      - .github/actions/**/*.cjs
      - .github/actions/**/*.ts
      - .github/actions/**/*.wgsl
      - .github/actions/detect-languages/**
      - .github/actions/shell-quality/**
      - .github/actions/javascript-quality/**
      - .github/actions/setup-sccache/**
      - .github/actions/finalize-sccache/**
      - .github/workflows/source-quality*.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-quality:
    uses: ./.github/workflows/source-quality.yml
    with:
      shell-format: false
      python-quality: false
