name: Zipp portable Python
on:
  pull_request:
    paths:
      - "zipp-python/**"
      - ".github/actions/zipp-python/**"
      - ".github/workflows/zipp-python.yml"
  push:
    branches: [main]
    paths:
      - "zipp-python/**"
      - ".github/actions/zipp-python/**"
      - ".github/workflows/zipp-python.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zipp-python
        id: zipp
      - name: Validate runtime and host contracts
        run: node --test zipp-python/run.test.mjs
