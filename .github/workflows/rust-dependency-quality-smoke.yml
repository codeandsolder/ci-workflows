name: Mandatory Rust dependency quality smoke

on:
  pull_request:
    paths:
      - ".github/actions/rust-dependency-quality/**"
      - ".github/workflows/rust-dependency-quality-smoke.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/rust-dependency-quality/**"
      - ".github/workflows/rust-dependency-quality-smoke.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start scan of fixture with intentionally unused path dependency
        id: start
        uses: ./.github/actions/rust-dependency-quality
        with:
          mode: start
          working-directories: '[".github/actions/rust-dependency-quality/fixtures/example","smoke-cache",".github/actions/rust-dependency-quality/fixtures/example"]'
      - name: Validate report generator while scan runs
        run: node --test .github/actions/rust-dependency-quality/*.test.mjs
      - name: Collect dependency report (intentional conflict)
        id: scan
        continue-on-error: true
        uses: ./.github/actions/rust-dependency-quality
        with:
          mode: finish
          scan-state: ${{ steps.start.outputs.scan-state }}
      - name: Assert real scanner execution and successful artifact upload
        shell: bash
        env:
          REPORT_ARTIFACT_ID: ${{ steps.scan.outputs.artifact-id }}
          REPORT_ROOT: ${{ steps.scan.outputs.report-root }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          # The scanner and assertion share a runner. Read the exact local
          # report rather than racing the artifact service's list operation.
          node - "$REPORT_ROOT" <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          assert.match(process.env.REPORT_ARTIFACT_ID ?? '', /^[1-9][0-9]*$/, 'Public report upload did not return an artifact ID');
          const root = process.argv[2];
          const index = JSON.parse(fs.readFileSync(root + '/index.json', 'utf8'));
          assert.deepEqual(index.map(entry => entry.directory), ['.github/actions/rust-dependency-quality/fixtures/example', 'smoke-cache']);
          const result = JSON.parse(fs.readFileSync(root + '/' + index[0].report + '/results.json', 'utf8'));
          const second = JSON.parse(fs.readFileSync(root + '/' + index[1].report + '/results.json', 'utf8'));
          assert.equal(second.directory, 'smoke-cache');
          assert(second.installed && second.anointInstalled && second.present, 'Second workspace was not scanned');
          assert(!second.audit.failed && !second.unused.failed && !second.anoint.failed, 'Second workspace scanner unavailable');
          assert(result.installed && result.anointInstalled && result.present, 'Scanners were not installed or fixture missing');
          assert(!result.audit.failed && !result.unused.failed && !result.anoint.failed, 'Scanner unavailable');
          assert.equal(result.auditExitCode, 0);
          assert.equal(result.unusedExitCode, 1);
          assert.deepEqual(result.unused.findings.map(f => f.dependency), ['local_helper']);
          assert.equal(process.env.SCAN_OUTCOME, 'failure', 'Conflict must fail the mandatory gate');
          assert.equal(result.anointExitCode, 1);
          assert(result.anoint.findings.some(f => f.kind === 'CapabilityOverlap' && f.current === 'wreq+reqwest'), 'Expected HTTP provider overlap');
          JS
