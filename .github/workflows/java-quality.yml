name: Shared Java quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  java-quality:
    name: Java PMD (when tracked Java exists)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout shared language modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions/detect-languages
            languages/detect.mjs
            languages/java
          sparse-checkout-cone-mode: false
      - name: Detect tracked Java
        id: detect
        uses: ./.ci-workflows/.github/actions/detect-languages
        with:
          source-root: ${{ github.workspace }}
          manifest: ${{ runner.temp }}/shared-ci-languages.json
      - name: Install Java for PMD
        if: steps.detect.outputs.has-java == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle for PMD
        if: steps.detect.outputs.has-java == 'true'
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
        with:
          gradle-version: '9.3.1'
      - name: Enforce shared PMD rules
        if: steps.detect.outputs.has-java == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -p .ci-workflows/languages/java \
            analyzeJava \
            -PsourceRoot="$GITHUB_WORKSPACE" \
            -PsourceManifest="$RUNNER_TEMP/shared-ci-languages.json"
      - name: Report skipped Java module
        if: steps.detect.outputs.has-java != 'true'
        shell: bash
        run: |
          echo "No Git-tracked Java sources: Java PMD module skipped." >> "$GITHUB_STEP_SUMMARY"
