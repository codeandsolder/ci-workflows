name: Renovate expired-quarantine recheck tests

on:
  pull_request:
    paths:
      - "scripts/renovate-quarantine-recheck*.mjs"
      - ".github/workflows/renovate-quarantine-recheck-test.yml"
  push:
    branches: [main]
    paths:
      - "scripts/renovate-quarantine-recheck*.mjs"
      - ".github/workflows/renovate-quarantine-recheck-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release-age parser, check selection, and GitHub API orchestration
        run: node --test scripts/renovate-quarantine-recheck*.test.mjs
