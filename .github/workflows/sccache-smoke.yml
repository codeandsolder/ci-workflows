name: Shared sccache smoke

on:
  push:
    branches: [fix/cache-pipeline-v8]
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        default: ubuntu-22.04
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: >-
        cargo +1.98.1 build --release --locked --offline --manifest-path smoke-cache/Cargo.toml
        && cargo +1.98.1 test --release --locked --offline --manifest-path smoke-generated-path/Cargo.toml
      rust-toolchain: "1.98.1"
      rustflags: "-C target-cpu=x86-64-v2"
      runner: ${{ inputs.runner }}
