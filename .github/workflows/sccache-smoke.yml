name: Shared sccache smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        default: ubuntu-22.04
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: >-
        cargo +1.99.0 build --release --locked --offline --manifest-path smoke-cache/Cargo.toml
        && cargo +1.99.0 clean --release --package shared-cache-smoke --manifest-path smoke-cache/Cargo.toml
        && cargo +1.99.0 build --release --locked --offline --manifest-path smoke-cache/Cargo.toml
        && cargo +1.99.0 test --release --locked --offline --manifest-path smoke-generated-path/Cargo.toml
      rust-toolchain: "1.99.0"
      rustflags: "-C target-cpu=x86-64-v2"
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-24.04' }}
