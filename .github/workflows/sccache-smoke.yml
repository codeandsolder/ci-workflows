name: Persistent Actions sccache smoke

on:
  pull_request:
    paths:
      - .github/workflows/rust-sccache.yml
      - .github/workflows/sccache-smoke.yml
      - .github/scripts/check-runner-routing.cjs
      - .github/scripts/test-public-cache-key.cjs
      - .github/scripts/test-cross-cache-stats.cjs
      - .github/actions/setup-sccache/**
      - .github/actions/finalize-sccache/**
      - smoke-cache/**
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-sccache.yml
      - .github/workflows/sccache-smoke.yml
      - .github/scripts/check-runner-routing.cjs
      - .github/scripts/test-public-cache-key.cjs
      - .github/scripts/test-cross-cache-stats.cjs
      - .github/actions/setup-sccache/**
      - .github/actions/finalize-sccache/**
      - smoke-cache/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  isolated-daemon:
    # Regression for Rust integration suites that start/stop their own sccache.
    uses: ./.github/workflows/rust-sccache.yml
    with:
      rust-toolchain: "1.99.1"
      isolate-public-sccache-server: true
      command: |
        # A nested checkout inside the caller must never appear as untracked
        # packaging input (cargo package rejects dirty source trees).
        test -z "$(git ls-files --others --exclude-standard -- .ci-workflows)"
        git check-ignore -q .ci-workflows/README.md
        test -S "$SCCACHE_SERVER_UDS"
        cargo +1.99.1 test --locked --offline --manifest-path smoke-cache/Cargo.toml
        sccache --show-stats >/dev/null
        test -S "$SCCACHE_SERVER_UDS"

  release-tier-skipped:
    # This test itself is scheduled on PR/main, not on a release tag.
    uses: ./.github/workflows/rust-sccache.yml
    with:
      validation-tier: release
      rust-toolchain: "1.99.1"
      command: cargo +1.99.1 check --manifest-path smoke-cache/Cargo.toml

  assert-release-tier-skipped:
    needs: release-tier-skipped
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public/private runner selection and managed cache backends
        run: |
          node .github/scripts/check-runner-routing.cjs
          node .github/scripts/test-public-cache-key.cjs
          node .github/scripts/test-cross-cache-stats.cjs

      - name: Non-release events must not execute compatibility lane
        env:
          RESULT: ${{ needs.release-tier-skipped.result }}
        run: test "$RESULT" = skipped

  prime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: >-
        cargo +1.99.0 test --release --locked --offline --manifest-path smoke-cache/Cargo.toml
      sccache-cache-scope: smoke-release
      rust-toolchain: "1.99.0"
      rustflags: "auto"
      runner: ${{ matrix.runner }}

  restore:
    if: github.event_name != 'pull_request'
    needs: prime
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: |
        cargo +1.99.0 test --release --locked --offline --manifest-path smoke-cache/Cargo.toml
        rust_hits="$(sccache --show-stats --stats-format json | jq -r '.stats.cache_hits.counts.Rust // 0')"
        if (( rust_hits < 1 )); then
          echo "expected restored compiler cache to produce at least one Rust hit" >&2
          exit 1
        fi
      sccache-cache-scope: smoke-release
      rust-toolchain: "1.99.0"
      rustflags: "auto"
      runner: ${{ matrix.runner }}


  cross-container:
    uses: ./.github/workflows/rust-sccache.yml
    with:
      rust-toolchain: "1.99.1"
      rustflags: "-D warnings"
      cache-execution: cross
      sccache-cache-scope: smoke-cross-aarch64
      command: |
        cross_version=0.2.5
        archive="$RUNNER_TEMP/cross.tar.gz"
        curl --fail --silent --show-error --location \
          "https://github.com/cross-rs/cross/releases/download/v$cross_version/cross-x86_64-unknown-linux-musl.tar.gz" -o "$archive"
        printf '%s  %s\n' a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588 "$archive" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP" cross cross-util
        rm "$archive"
        export PATH="$RUNNER_TEMP:$PATH"
        export CROSS_TARGET_AARCH64_UNKNOWN_LINUX_GNU_IMAGE=ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge
        cd smoke-cache
        CARGO_TARGET_DIR="$RUNNER_TEMP/cross-target-a" cross test --target aarch64-unknown-linux-gnu --locked --offline --release
        CARGO_TARGET_DIR="$RUNNER_TEMP/cross-target-b" cross test --target aarch64-unknown-linux-gnu --locked --offline --release
        jq -es 'map(.stats.cache_hits.counts.Rust // 0) | add > 0' "$CODEANDSOLDER_CROSS_CACHE_CONTROL"/stats.*.json
