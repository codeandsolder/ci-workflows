name: Shared stable Rust release review
on:
  workflow_call:
permissions:
  contents: read
  issues: write
concurrency:
  group: shared-stable-rust-review
  cancel-in-progress: false
jobs:
  queue:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/rust-release-review.mjs
            policy-wasm/module.json
            policy-wasm/module.wasm.gz
            policy-wasm/module.mjs
            policy-wasm/bridge.mjs
            policy-wasm/run.mjs
            policy-wasm/workspace.mjs
          sparse-checkout-cone-mode: false
      - name: Queue review for the current stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rust-release-review.mjs "${{ github.repository }}"
