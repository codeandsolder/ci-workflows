name: Shared upstream tracking

on:
  workflow_call:
    inputs:
      upstream-repository:
        required: true
        type: string
      upstream-branch:
        required: true
        type: string
      target-branch:
        required: true
        type: string
      workflow-policy:
        type: string
        default: reject
      generated-files:
        description: Whitespace-separated exact tracked files to regenerate after rebasing onto upstream.
        type: string
        default: ""
      generation-script:
        description: Reviewed fork generation script, executed in a read-only candidate job.
        type: string
        default: ""
      generation-container:
        description: Immutable image containing the native build prerequisites.
        type: string
        default: ""
      upstream-release-prefix:
        description: Track stable release tags with this prefix, publishing corresponding vMAJOR.MINOR.PATCH tags.
        type: string
        default: ""
      validation-script:
        description: Fork-owned validation script (read from the current target branch).
        type: string
        required: true
      rust-toolchain:
        description: Exact Rust toolchain, repository for the quarantined native pin, or empty for non-Rust validation.
        type: string
        default: ""
      java-version:
        description: JDK version for a Java or Gradle validator.
        type: string
        default: ""
      vulkan-sdk-version:
        description: Vulkan SDK version for a graphics validator.
        type: string
        default: ""
      go-version-file:
        type: string
        default: ""
      go:
        type: boolean
        default: false
      nightly-format:
        type: boolean
        default: false
      cargo-artifact:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 90

concurrency:
  # One observation, candidate and report at a time per fork.
  group: ${{ github.event_name == 'pull_request' && format('upstream-tracking-pr-{0}', github.event.pull_request.number) || 'upstream-tracking' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  observe:
    # Calling workflows may only run on the reviewed target branch, never a PR.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', inputs.target-branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      status: ${{ steps.observe.outputs.status }}
      base: ${{ steps.observe.outputs.base }}
      upstream: ${{ steps.observe.outputs.upstream }}
      tip: ${{ steps.observe.outputs.tip }}
      release_tag: ${{ steps.observe.outputs.release_tag }}
      downstream_tag: ${{ steps.observe.outputs.downstream_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-upstream
          persist-credentials: false
          sparse-checkout: .github/actions/upstream-tracking
      - name: Observe upstream and select a 72-hour-old snapshot
        id: observe
        env:
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_BRANCH: ${{ inputs.upstream-branch }}
          VALIDATION: ${{ inputs.validation-script }}
          GENERATED_FILES: ${{ inputs.generated-files }}
          GENERATOR: ${{ inputs.generation-script }}
          GENERATION_CONTAINER: ${{ inputs.generation-container }}
          RELEASE_PREFIX: ${{ inputs.upstream-release-prefix }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_POLICY: ${{ inputs.workflow-policy }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_POLICY" in reject|preserve) ;; *) exit 2;; esac
          test -n "$VALIDATION"
          if [[ -n "$GENERATOR$GENERATED_FILES$GENERATION_CONTAINER" ]]; then
            test -n "$GENERATOR"
            test -n "$GENERATED_FILES"
            [[ "$GENERATION_CONTAINER" =~ @sha256:[0-9a-f]{64}$ ]]
          fi
          node .ci-upstream/.github/actions/upstream-tracking/observe.mjs "$UPSTREAM_REPOSITORY" "$UPSTREAM_BRANCH" "$RELEASE_PREFIX"

  prepare:
    needs: observe
    if: needs.observe.outputs.status == 'ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      head: ${{ steps.prepare.outputs.head }}
      changed: ${{ steps.prepare.outputs.changed }}
      drift: ${{ steps.prepare.outputs.workflow_drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.observe.outputs.base }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-upstream
          persist-credentials: false
          sparse-checkout: .github/actions/upstream-tracking
      - name: Construct exact candidate from mature snapshot
        id: prepare
        env:
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_BRANCH: ${{ inputs.upstream-branch }}
          UPSTREAM: ${{ needs.observe.outputs.upstream }}
          BASE: ${{ needs.observe.outputs.base }}
          WORKFLOW_POLICY: ${{ inputs.workflow-policy }}
          GENERATED_FILES: ${{ inputs.generated-files }}
        run: |
          node .ci-upstream/.github/actions/upstream-tracking/prepare.mjs "$UPSTREAM_REPOSITORY" "$UPSTREAM_BRANCH" "$UPSTREAM" "$BASE" "$WORKFLOW_POLICY" "$RUNNER_TEMP/candidate.bundle" "$GENERATED_FILES"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/candidate.bundle
          retention-days: 2
          if-no-files-found: error

  generate:
    needs: [observe, prepare]
    if: needs.prepare.outputs.changed == 'true' && inputs.generation-script != ''
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.generation-container || 'ubuntu:24.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      head: ${{ steps.commit.outputs.head }}
      eligible: ${{ steps.quarantine.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.observe.outputs.base }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Read reviewed generator
        env:
          GENERATOR: ${{ inputs.generation-script }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git show "HEAD:$GENERATOR" > "$RUNNER_TEMP/generate-upstream.sh"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}
      - name: Check out prepared candidate
        env:
          EXPECTED: ${{ needs.prepare.outputs.head }}
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          git checkout --detach "$EXPECTED"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-upstream
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            policy-wasm
            rust-toolchain.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Detect tracked Rust source in the exact prepared candidate
        id: rust-source
        run: node .ci-upstream/.github/actions/upstream-tracking/detect-cargo.mjs "$GITHUB_WORKSPACE" "$GITHUB_OUTPUT"
      - name: Enforce external crate release age before regeneration
        id: quarantine
        if: steps.rust-source.outputs.rust == 'true' || inputs.rust-toolchain != ''
        uses: ./.ci-upstream/.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ needs.observe.outputs.base }}
          hours: "72"
          fail-on-blocked: "false"
      - name: Resolve reviewed provider compiler when Rust input is omitted
        id: provider-compiler
        if: steps.rust-source.outputs.rust == 'true' && inputs.rust-toolchain == '' && steps.quarantine.outputs.eligible == 'true'
        uses: ./.ci-upstream/.github/actions/resolve-rust-toolchain
        with:
          repository-path: .ci-upstream
          validation-tier: routine
      - name: Resolve quarantined repository nightly
        id: repository-compiler
        if: inputs.rust-toolchain == 'repository' && steps.quarantine.outputs.eligible == 'true'
        uses: ./.ci-upstream/.github/actions/resolve-rust-toolchain
        with:
          validation-tier: routine
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: (steps.rust-source.outputs.rust == 'true' || inputs.rust-toolchain != '') && steps.quarantine.outputs.eligible == 'true'
        with:
          toolchain: ${{ inputs.rust-toolchain == 'repository' && steps.repository-compiler.outputs.channel || (inputs.rust-toolchain != '' && inputs.rust-toolchain || steps.provider-compiler.outputs.channel) }}
          components: rustfmt, clippy
      - uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@f79aef2a560a2c1c0f06f3c657f690f778040156 # main
        if: (steps.rust-source.outputs.rust == 'true' || inputs.rust-toolchain != '') && steps.quarantine.outputs.eligible == 'true'
        with:
          rust-toolchain: ${{ inputs.rust-toolchain == 'repository' && steps.repository-compiler.outputs.channel || (inputs.rust-toolchain != '' && inputs.rust-toolchain || steps.provider-compiler.outputs.channel) }}
      - name: Regenerate and commit only the declared artifacts
        id: commit
        if: (steps.rust-source.outputs.rust != 'true' && inputs.rust-toolchain == '') || steps.quarantine.outputs.eligible == 'true'
        env:
          SOURCE: ${{ needs.prepare.outputs.head }}
          BASE: ${{ needs.observe.outputs.base }}
          UPSTREAM: ${{ needs.observe.outputs.upstream }}
          GENERATED: ${{ inputs.generated-files }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/generate-upstream.sh" "$UPSTREAM" "$BASE"
          node .ci-upstream/.github/actions/upstream-tracking/generated.mjs commit "$SOURCE" "$BASE" "$GENERATED" "$RUNNER_TEMP/generated.bundle"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.commit.outputs.head != ''
        with:
          name: upstream-generated-candidate
          path: ${{ runner.temp }}/generated.bundle
          retention-days: 2
          if-no-files-found: error
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@f79aef2a560a2c1c0f06f3c657f690f778040156 # main

  validate:
    needs: [observe, prepare, generate]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.observe.result == 'success' && ((needs.observe.outputs.status == 'ready' && needs.prepare.result == 'success' && (inputs.generation-script == '' || (needs.generate.result == 'success' && needs.generate.outputs.head != ''))) || needs.observe.outputs.status == 'current'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: read
    outputs:
      eligible: ${{ steps.quarantine.outputs.eligible }}
      rust: ${{ steps.rust-source.outputs.rust }}
      checked: ${{ steps.check.outputs.checked }}
      release_needed: ${{ steps.check.outputs.release_needed }}
      head: ${{ steps.validated.outputs.head }}
    steps:
      - name: Decide whether validation is necessary
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ needs.observe.outputs.status }}
          RELEASE_TAG: ${{ needs.observe.outputs.downstream_tag }}
        run: |
          set -euo pipefail
          release_needed=false
          if [[ -n "$RELEASE_TAG" ]]; then
            releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
            if ! jq -e --arg tag "$RELEASE_TAG" 'any(.[][]; .tag_name == $tag and (.draft | not) and (.prerelease | not))' <<< "$releases" >/dev/null; then
              release_needed=true
            elif [[ "$STATUS" == ready ]]; then
              echo "Upstream candidate would reuse an existing downstream release tag" >&2
              exit 1
            fi
          fi
          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" == current && "$release_needed" == false ]]; then
            issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "Upstream tracking failed" or .title == "Automated upstream parity failure") | .number')
            if [[ -z "$issue" ]]; then
              echo checked=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo checked=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check.outputs.checked == 'true'
        with:
          ref: ${{ needs.observe.outputs.base || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Read reviewed validator
        if: steps.check.outputs.checked == 'true'
        env:
          VALIDATOR: ${{ inputs.validation-script }}
        run: |
          set -euo pipefail
          git show "HEAD:$VALIDATOR" > "$RUNNER_TEMP/validate-upstream.sh"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.prepare.outputs.changed == 'true'
        with:
          name: ${{ inputs.generation-script != '' && 'upstream-generated-candidate' || 'upstream-candidate' }}
          path: ${{ runner.temp }}
      - name: Check out exact candidate
        if: needs.prepare.outputs.changed == 'true'
        env:
          EXPECTED: ${{ needs.generate.outputs.head || needs.prepare.outputs.head }}
          BUNDLE_NAME: ${{ inputs.generation-script != '' && 'generated.bundle' || 'candidate.bundle' }}
        run: |
          git fetch "$RUNNER_TEMP/$BUNDLE_NAME" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          git checkout --detach "$EXPECTED"
      # Detect Rust automatically, including when no toolchain input is supplied.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check.outputs.checked == 'true'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            policy-wasm
            rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - name: Detect tracked Rust source in the exact generated candidate
        id: rust-source
        if: steps.check.outputs.checked == 'true'
        run: node .ci-workflows/.github/actions/upstream-tracking/detect-cargo.mjs "$GITHUB_WORKSPACE" "$GITHUB_OUTPUT"
      - name: Enforce external crate release age as well
        id: quarantine
        if: steps.check.outputs.checked == 'true' && (steps.rust-source.outputs.rust == 'true' || inputs.rust-toolchain != '')
        uses: ./.ci-workflows/.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ needs.observe.outputs.base || github.event.pull_request.base.sha }}
          hours: "72"
          fail-on-blocked: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        if: steps.check.outputs.checked == 'true' && inputs.nightly-format && steps.quarantine.outputs.eligible == 'true'
        with:
          components: rustfmt
      - name: Resolve reviewed provider compiler when Rust input is omitted
        id: provider-compiler
        if: steps.check.outputs.checked == 'true' && steps.rust-source.outputs.rust == 'true' && inputs.rust-toolchain == '' && steps.quarantine.outputs.eligible == 'true'
        uses: ./.ci-workflows/.github/actions/resolve-rust-toolchain
        with:
          repository-path: .ci-workflows
          validation-tier: routine
      - name: Resolve quarantined repository nightly
        id: repository-compiler
        if: steps.check.outputs.checked == 'true' && inputs.rust-toolchain == 'repository' && steps.quarantine.outputs.eligible == 'true'
        uses: ./.ci-workflows/.github/actions/resolve-rust-toolchain
        with:
          validation-tier: routine
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: steps.check.outputs.checked == 'true' && (steps.rust-source.outputs.rust == 'true' || inputs.rust-toolchain != '') && steps.quarantine.outputs.eligible == 'true'
        with:
          toolchain: ${{ inputs.rust-toolchain == 'repository' && steps.repository-compiler.outputs.channel || (inputs.rust-toolchain != '' && inputs.rust-toolchain || steps.provider-compiler.outputs.channel) }}
          components: rustfmt, clippy
      - uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@f79aef2a560a2c1c0f06f3c657f690f778040156 # main
        if: steps.check.outputs.checked == 'true' && (steps.rust-source.outputs.rust == 'true' || inputs.rust-toolchain != '') && steps.quarantine.outputs.eligible == 'true'
        with:
          rust-toolchain: ${{ inputs.rust-toolchain == 'repository' && steps.repository-compiler.outputs.channel || (inputs.rust-toolchain != '' && inputs.rust-toolchain || steps.provider-compiler.outputs.channel) }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: steps.check.outputs.checked == 'true' && inputs.go
        with:
          go-version: ${{ inputs.go-version-file == '' && 'stable' || '' }}
          go-version-file: ${{ inputs.go-version-file }}
          cache: ${{ inputs.go-version-file != '' }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: steps.check.outputs.checked == 'true' && inputs.java-version != ''
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        if: steps.check.outputs.checked == 'true' && inputs.vulkan-sdk-version != '' && steps.quarantine.outputs.eligible == 'true'
        with:
          vulkan_version: ${{ inputs.vulkan-sdk-version }}
          install_runtime: false
          cache: false
          stripdown: true
      - name: Run reviewed fork validation
        if: steps.check.outputs.checked == 'true' && ((steps.rust-source.outputs.rust != 'true' && inputs.rust-toolchain == '') || steps.quarantine.outputs.eligible == 'true')
        env:
          UPSTREAM_SHA: ${{ needs.observe.outputs.upstream }}
          FORK_BASE: ${{ needs.observe.outputs.base || github.event.pull_request.base.sha }}
          RELEASE_TAG: ${{ needs.observe.outputs.release_tag }}
        run: |
          args=("$UPSTREAM_SHA" "$FORK_BASE")
          if [[ -n "$RELEASE_TAG" ]]; then args+=("$RELEASE_TAG"); fi
          bash "$RUNNER_TEMP/validate-upstream.sh" "${args[@]}"
          git diff --exit-code HEAD --
      # A maintained fork carries a small patch stack over upstream-owned source.
      # The reviewed fork validator is authoritative; first-party source-policy
      # gates belong to ordinary first-party CI, not imported upstream code.
      - name: Record exactly validated revision
        id: validated
        if: steps.check.outputs.checked == 'true' && ((steps.rust-source.outputs.rust != 'true' && inputs.rust-toolchain == '') || steps.quarantine.outputs.eligible == 'true')
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload validated Cargo binary
        if: inputs.cargo-artifact && steps.check.outputs.checked == 'true' && steps.quarantine.outputs.eligible == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cargo-ephemeral-linux-x86_64
          path: |
            target/release/cargo
            cargo-ephemeral-build.txt
          retention-days: 14
          if-no-files-found: error
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@f79aef2a560a2c1c0f06f3c657f690f778040156 # main

  publish:
    needs: [observe, prepare, generate, validate]
    if: ${{ !cancelled() && needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success' && needs.validate.outputs.head != '' && ((inputs.rust-toolchain == '' && needs.validate.outputs.rust != 'true') || needs.validate.outputs.eligible == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-upstream
          persist-credentials: false
          sparse-checkout: .github/actions/upstream-tracking
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.generation-script != '' && 'upstream-generated-candidate' || 'upstream-candidate' }}
          path: ${{ runner.temp }}
      - name: Publish exactly the validated revision
        env:
          TARGET: ${{ inputs.target-branch }}
          BASE: ${{ needs.observe.outputs.base }}
          HEAD: ${{ needs.validate.outputs.head }}
          SOURCE: ${{ needs.prepare.outputs.head }}
          GENERATED_HEAD: ${{ needs.generate.outputs.head }}
          UPSTREAM: ${{ needs.observe.outputs.upstream }}
          GENERATED_FILES: ${{ inputs.generated-files }}
        run: |
          set -euo pipefail
          if [[ -n "$GENERATED_HEAD" ]]; then
            test "$HEAD" = "$GENERATED_HEAD"
            node .ci-upstream/.github/actions/upstream-tracking/publish.mjs "$TARGET" "$BASE" "$HEAD" "$UPSTREAM" "$RUNNER_TEMP/generated.bundle" "$SOURCE" "$GENERATED_FILES"
          else
            test "$HEAD" = "$SOURCE"
            node .ci-upstream/.github/actions/upstream-tracking/publish.mjs "$TARGET" "$BASE" "$HEAD" "$UPSTREAM" "$RUNNER_TEMP/candidate.bundle"
          fi

  release:
    needs: [observe, prepare, generate, validate, publish]
    if: ${{ !cancelled() && needs.observe.outputs.release_tag != '' && needs.validate.result == 'success' && needs.validate.outputs.release_needed == 'true' && needs.validate.outputs.head != '' && (needs.publish.result == 'success' || needs.observe.outputs.status == 'current') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.head }}
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-upstream
          persist-credentials: false
          sparse-checkout: .github/actions/upstream-tracking
      - name: Release the validated upstream crate version
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          RELEASE_PREFIX: ${{ inputs.upstream-release-prefix }}
          RELEASE_TAG: ${{ needs.observe.outputs.release_tag }}
          UPSTREAM: ${{ needs.observe.outputs.upstream }}
          HEAD: ${{ needs.validate.outputs.head }}
          TARGET: ${{ inputs.target-branch }}
        run: |
          node .ci-upstream/.github/actions/upstream-tracking/releases.mjs publish "$GITHUB_REPOSITORY" "$UPSTREAM_REPOSITORY" "$RELEASE_PREFIX" "$RELEASE_TAG" "$UPSTREAM" "$HEAD" "$TARGET"

  report:
    needs: [observe, prepare, generate, validate, publish, release]
    if: ${{ always() && !cancelled() && needs.observe.result != 'skipped' && needs.observe.outputs.status != 'already-run' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Maintain tracking and workflow-drift issues
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVE: ${{ needs.observe.result }}
          PREPARE: ${{ needs.prepare.result }}
          VALIDATE: ${{ needs.validate.result }}
          GENERATE: ${{ needs.generate.result }}
          PUBLISH: ${{ needs.publish.result }}
          RELEASE: ${{ needs.release.result }}
          STATUS: ${{ needs.observe.outputs.status }}
          ELIGIBLE: ${{ needs.validate.outputs.eligible }}
          CHECKED: ${{ needs.validate.outputs.checked }}
          DRIFT: ${{ needs.prepare.outputs.drift }}
          BASE: ${{ needs.observe.outputs.base }}
          UPSTREAM: ${{ needs.observe.outputs.upstream }}
          TIP: ${{ needs.observe.outputs.tip }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          url="$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
          lookup() {
            gh issue list --repo "$repo" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$1\") | .number"
          }
          maintain() {
            local title=$1 body=$2 issue
            issue=$(lookup "$title")
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --repo "$repo" --body "$body"
            else
              gh issue create --repo "$repo" --title "$title" --body "$body"
            fi
          }
          close() {
            local issue
            issue=$(lookup "$1")
            if [[ -n "$issue" ]]; then gh issue close "$issue" --repo "$repo" --comment "Recovered: $url"; fi
          }
          failed=false
          for result in "$OBSERVE" "$PREPARE" "$GENERATE" "$VALIDATE" "$PUBLISH" "$RELEASE"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then failed=true; fi
          done
          if [[ "$DRIFT" == true ]]; then
            maintain "Upstream workflow changes require manual reconciliation" "Incoming workflow changes need a reviewed PR. Fork base: $BASE; upstream: $UPSTREAM. Run: $url"
          fi
          if [[ "$failed" == true ]]; then
            maintain "Upstream tracking failed" "$(printf 'Upstream tracking failed.\n\nObservation: %s\nPreparation: %s\nGeneration: %s\nValidation: %s\nPublication: %s\nRelease: %s\nFork base: %s\nEligible upstream: %s\nObserved tip: %s\n\nRun: %s\n' "$OBSERVE" "$PREPARE" "$GENERATE" "$VALIDATE" "$PUBLISH" "$RELEASE" "$BASE" "$UPSTREAM" "$TIP" "$url")"
            exit 1
          fi
          if [[ "$CHECKED" == true && "$VALIDATE" == success && "$ELIGIBLE" != false ]]; then
            close "Upstream tracking failed"
            close "Automated upstream parity failure"
          fi
