name: Stable Rust release review tests
on:
  pull_request:
    paths:
      - scripts/rust-release-review*.mjs
      - .github/workflows/rust-release-review*.yml
  push:
    branches: [main]
    paths:
      - scripts/rust-release-review*.mjs
      - .github/workflows/rust-release-review*.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test scripts/rust-release-review.test.mjs
