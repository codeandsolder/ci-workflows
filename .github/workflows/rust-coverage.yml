name: Informational Rust source coverage

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Explicit toolchain or the caller's pinned Rust toolchain
        required: false
        default: ""
        type: string
      working-directory:
        description: Cargo workspace directory relative to the caller checkout
        required: false
        default: "."
        type: string
      cargo-args:
        description: Whitespace-separated test selection arguments for cargo llvm-cov
        required: false
        default: "--workspace --locked"
        type: string
      runner:
        description: Public GitHub-hosted runner
        required: false
        default: "ubuntu-24.04"
        type: string
      timeout-minutes:
        description: Coverage job timeout
        required: false
        default: 90
        type: number

permissions:
  contents: read

jobs:
  coverage:
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: ":"
      rust-toolchain: ${{ inputs.rust-toolchain }}
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      sccache-cache-scope: rust-coverage
      coverage-report: true
      coverage-working-directory: ${{ inputs.working-directory }}
      coverage-cargo-args: ${{ inputs.cargo-args }}
