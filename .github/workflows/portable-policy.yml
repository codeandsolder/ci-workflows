name: Portable shared CI policy

on:
  pull_request:
    paths:
      - "policy-wasm/**"
      - ".github/scripts/test-workflow-concurrency.py"
      - ".github/scripts/test-clone-regression-policy.py"
      - ".github/scripts/clone-regression-oracle.py"
      - ".github/scripts/test-rust-ci-sccache-policy.py"
      - ".github/scripts/rust-ci-sccache-oracle.py"
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/scripts/workflow-concurrency-oracle.py"
      - ".github/workflows/portable-policy.yml"
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - "policy-wasm/**"
      - ".github/scripts/test-workflow-concurrency.py"
      - ".github/scripts/test-clone-regression-policy.py"
      - ".github/scripts/clone-regression-oracle.py"
      - ".github/scripts/test-rust-ci-sccache-policy.py"
      - ".github/scripts/rust-ci-sccache-oracle.py"
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/scripts/workflow-concurrency-oracle.py"
      - ".github/workflows/portable-policy.yml"
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-release-age:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/cargo-release-quarantine.yml
  validate:
    name: Validate portable shared CI module
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: ./.github/actions/resolve-rust-toolchain
        id: compiler
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: wasm32-wasip1
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          rustflags: ""
      - name: Build and test portable module
        shell: bash
        run: |
          cargo test --manifest-path policy-wasm/Cargo.toml --locked --target-dir "$RUNNER_TEMP/ci-policy"
          cargo build --manifest-path policy-wasm/Cargo.toml --locked --release --target wasm32-wasip1 --target-dir "$RUNNER_TEMP/ci-policy"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-policy-wasm
          path: ${{ runner.temp }}/ci-policy/wasm32-wasip1/release/ci-policy.wasm
          if-no-files-found: error
      - name: Compare portable workflow policy with existing fixtures
        # The host filesystem bridge and bundle are tested separately.
        shell: bash
        run: |
          node --test policy-wasm/workspace.test.mjs
          uv run --project .github --locked python -B .github/scripts/test-workflow-concurrency.py --wasm "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm"
          uv run --project .github --locked python -B .github/scripts/test-rust-ci-sccache-policy.py --wasm "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm"
          node policy-wasm/quarantine.test.mjs "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm"
          uv run --project .github --locked python -B .github/scripts/test-clone-regression-policy.py --wasm "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm"
          node policy-wasm/run.mjs "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm" sccache .
          node policy-wasm/package.mjs verify "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm" "${{ steps.compiler.outputs.channel }}"
          node --test policy-wasm/workspace.test.mjs
          uv run --project .github --locked python -B .github/scripts/test-workflow-concurrency.py --wasm policy-wasm/module.json
          uv run --project .github --locked python -B .github/scripts/test-rust-ci-sccache-policy.py --wasm policy-wasm/module.json
          uv run --project .github --locked python -B .github/scripts/test-clone-regression-policy.py --wasm policy-wasm/module.json
          node policy-wasm/quarantine.test.mjs policy-wasm/module.json
          node policy-wasm/run.mjs policy-wasm/module.json sccache .
          node policy-wasm/run.mjs policy-wasm/module.json concurrency .
      - name: Verify the actual sparse caller checkout
        shell: bash
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/sparse-ci-policy"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$gate"
          awk '$0 == "          sparse-checkout: |" { reading=1; next } reading && /^            / { sub(/^            /, ""); print; next } reading { exit }' .github/workflows/workflow-concurrency.yml |
            git -C "$gate" sparse-checkout set --no-cone --stdin
          git -C "$gate" checkout --detach "$(git rev-parse HEAD)"
          test ! -e "$gate/policy-wasm/src"
          node "$gate/policy-wasm/run.mjs" "$gate/policy-wasm/module.json" concurrency "$GITHUB_WORKSPACE"
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main

  portable-runtime:
    name: Portable CI policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Validate the same policy binary on each platform
        shell: bash
        run: |
          node --test policy-wasm/workspace.test.mjs
          uv run --project .github --locked python -B .github/scripts/test-workflow-concurrency.py --wasm policy-wasm/module.json
          uv run --project .github --locked python -B .github/scripts/test-rust-ci-sccache-policy.py --wasm policy-wasm/module.json
          uv run --project .github --locked python -B .github/scripts/test-clone-regression-policy.py --wasm policy-wasm/module.json
          node policy-wasm/quarantine.test.mjs policy-wasm/module.json
