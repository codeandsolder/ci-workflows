name: Portable shared CI policy

on:
  pull_request:
    paths:
      - "policy-wasm/**"
      - "scripts/fleet-scope.mjs"
      - "scripts/test-policy-wasm.sh"
      - ".github/actions/cargo-release-quarantine/**"
      - ".github/workflows/cargo-release-quarantine.yml"
      - ".github/actions/resolve-rust-toolchain/**"
      - "scripts/rust-release-review*.mjs"
      - "scripts/runner-availability*.mjs"
      - "scripts/renovate-quarantine-recheck*.mjs"
      - ".github/workflows/rust-release-review*.yml"
      - ".github/actions/cargo-affected/**"
      - ".github/actions/pr-checklist-labels/**"
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/workflows/portable-policy.yml"
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - "policy-wasm/**"
      - "scripts/fleet-scope.mjs"
      - "scripts/test-policy-wasm.sh"
      - ".github/actions/cargo-release-quarantine/**"
      - ".github/workflows/cargo-release-quarantine.yml"
      - ".github/actions/resolve-rust-toolchain/**"
      - "scripts/rust-release-review*.mjs"
      - "scripts/runner-availability*.mjs"
      - "scripts/renovate-quarantine-recheck*.mjs"
      - ".github/workflows/rust-release-review*.yml"
      - ".github/actions/cargo-affected/**"
      - ".github/actions/pr-checklist-labels/**"
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/workflows/portable-policy.yml"
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-release-age:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/cargo-release-quarantine.yml
  validate:
    name: Validate portable shared CI module
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/resolve-rust-toolchain
        id: compiler
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: wasm32-wasip1
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@945fa80aba9612faf36918d309369316db9b13e7 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          rustflags: ""
      - name: Build and test portable module
        shell: bash
        run: |
          cargo test --manifest-path policy-wasm/Cargo.toml --locked --target-dir "$RUNNER_TEMP/ci-policy"
          node policy-wasm/build.mjs "$RUNNER_TEMP/ci-policy"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-policy-wasm
          path: ${{ runner.temp }}/ci-policy/wasm32-wasip1/release/ci-policy.wasm
          if-no-files-found: error
      - name: Test host bridge, freshly built and bundled policy
        shell: bash
        run: |
          node --test policy-wasm/workspace.test.mjs
          bash scripts/test-policy-wasm.sh "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm"
          node policy-wasm/run.mjs "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm" sccache .
          node policy-wasm/package.mjs verify "$RUNNER_TEMP/ci-policy/wasm32-wasip1/release/ci-policy.wasm" "${{ steps.compiler.outputs.channel }}"
          bash scripts/test-policy-wasm.sh policy-wasm/module.json
          node policy-wasm/run.mjs policy-wasm/module.json sccache .
          node policy-wasm/run.mjs policy-wasm/module.json concurrency .
      - name: Verify the actual sparse caller checkout
        shell: bash
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/sparse-ci-policy"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$gate"
          awk '$0 == "          sparse-checkout: |" { reading=1; next } reading && /^            / { sub(/^            /, ""); print; next } reading { exit }' .github/workflows/workflow-concurrency.yml |
            git -C "$gate" sparse-checkout set --no-cone --stdin
          git -C "$gate" checkout --detach "$(git rev-parse HEAD)"
          test ! -e "$gate/policy-wasm/src"
          test -f "$gate/.github/actions/actionlint-policy/action.yml"
          test -f "$gate/languages/actionlint/run.sh"
          test -f "$gate/languages/tools/install.sh"
          node "$gate/policy-wasm/run.mjs" "$gate/policy-wasm/module.json" concurrency "$GITHUB_WORKSPACE"
      - name: Verify real Renovate recheck CLI orchestration
        run: node --test scripts/renovate-quarantine-recheck.integration.test.mjs
      - name: Check baseline Git transport
        run: node --test .github/actions/cargo-release-quarantine/fetch_baseline.test.mjs

      - name: Resolve the checked-out PR merge parent without Git credentials
        id: baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # A PR event's base SHA can lag behind the checked-out merge commit.
          # Use its actual first parent, already present at fetch-depth 2.
          read -r -a parents <<< "$(git show -s --format=%P HEAD)"
          (( ${#parents[@]} == 2 )) || { echo 'Expected a two-parent PR merge commit' >&2; exit 1; }
          git cat-file -e "${parents[0]}^{commit}"
          printf 'sha=%s\n' "${parents[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate the real sparse provider checkout
        shell: bash
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/sparse-quarantine"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$gate"
          awk '$0 == "          sparse-checkout: |" { reading=1; next } reading && /^            / { sub(/^            /, ""); print; next } reading { exit }' .github/workflows/cargo-release-quarantine.yml |
            git -C "$gate" sparse-checkout set --no-cone --stdin
          git -C "$gate" checkout --detach "$(git rev-parse HEAD)"
          test ! -e "$gate/policy-wasm/src"
          node "$gate/policy-wasm/quarantine.mjs" "$gate/policy-wasm/module.json" HEAD 72 .quarantine-smoke/not-present.lock

      - name: Create synthetic introduced crates.io entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .quarantine-smoke
          cat > .quarantine-smoke/Cargo.lock <<'LOCK'
          version = 4

          [[package]]
          name = "serde"
          version = "1.0.228"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "9a8e94ea7f378bd32cbbd37198a4a91436180c5bb472411e48b5ec2e2124ae9e"
          LOCK

      - name: Workflow-only update with no Cargo.lock passes immediately
        id: no-lockfile
        uses: ./.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ steps.baseline.outputs.sha || github.sha }}
          hours: "1000000"
          lockfile: .quarantine-smoke/not-present.lock

      - name: Assert missing lockfile is not quarantined
        if: ${{ steps.no-lockfile.outputs.eligible != 'true' }}
        shell: bash
        run: exit 1

      - name: Remove a tracked baseline file to simulate lockfile deletion
        shell: bash
        run: rm README.md

      - name: Reject removal of a baseline lockfile
        id: removed-lockfile
        continue-on-error: true
        uses: ./.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ steps.baseline.outputs.sha || github.sha }}
          hours: "0"
          lockfile: README.md

      - name: Assert lockfile removal was rejected
        if: ${{ steps.removed-lockfile.outcome != 'failure' }}
        shell: bash
        run: exit 1

      - name: Restore tracked file
        if: always()
        shell: bash
        run: git restore -- README.md

      - name: Old release passes a zero-hour quarantine
        id: eligible
        uses: ./.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ steps.baseline.outputs.sha || github.sha }}
          hours: "0"
          lockfile: .quarantine-smoke/Cargo.lock

      - name: Assert eligible output
        if: ${{ steps.eligible.outputs.eligible != 'true' }}
        shell: bash
        run: exit 1

      - name: Soft probe reports blocked without failing
        id: soft-blocked
        uses: ./.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ steps.baseline.outputs.sha || github.sha }}
          hours: "1000000"
          lockfile: .quarantine-smoke/Cargo.lock
          fail-on-blocked: "false"

      - name: Assert soft-probe output
        if: ${{ steps.soft-blocked.outputs.eligible != 'false' }}
        shell: bash
        run: exit 1

      - name: Hard quarantine fails
        id: hard-blocked
        continue-on-error: true
        uses: ./.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ steps.baseline.outputs.sha || github.sha }}
          hours: "1000000"
          lockfile: .quarantine-smoke/Cargo.lock

      - name: Assert hard quarantine failed
        if: ${{ steps.hard-blocked.outcome != 'failure' }}
        shell: bash
        run: exit 1

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@945fa80aba9612faf36918d309369316db9b13e7 # main

  portable-runtime:
    name: Portable CI policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the same policy binary on each platform
        shell: bash
        run: |
          node --test policy-wasm/workspace.test.mjs
          bash scripts/test-policy-wasm.sh policy-wasm/module.json
