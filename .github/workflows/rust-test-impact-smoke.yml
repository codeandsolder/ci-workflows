name: Unified Rust test suite smoke

on:
  pull_request:
    paths:
      - ".github/workflows/rust-sccache.yml"
      - ".github/workflows/rust-test-impact.yml"
      - ".github/workflows/rust-test-impact-smoke.yml"
      - ".github/actions/rust-test-impact/**"
      - "smoke-cache/**"
      - "policy-wasm/Cargo.*"
      - "policy-wasm/src/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust-sccache.yml"
      - ".github/workflows/rust-test-impact.yml"
      - ".github/workflows/rust-test-impact-smoke.yml"
      - ".github/actions/rust-test-impact/**"
      - "smoke-cache/**"
      - "policy-wasm/Cargo.*"
      - "policy-wasm/src/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  compare-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert shadow miss and cache-miss semantics
        run: node --test .github/actions/rust-test-impact/*.test.mjs

  end-to-end:
    uses: ./.github/workflows/rust-test-impact.yml
    with:
      test-suites: '[{"name":"policy","directory":"policy-wasm"}]'

  shared-provider-end-to-end:
    # Exercise the typed suite through the same provider used by consumers.
    # The policy crate is binary-only; no duplicate normal unit-test command.
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: cargo fmt --manifest-path policy-wasm/Cargo.toml --all -- --check
      test-suites: |
        [
          {"name":"cache","directory":"policy-wasm","nextest":["-E","test(cache::tests::)"]},
          {"name":"other","directory":"policy-wasm","nextest":["-E","not test(cache::tests::)"]}
        ]
      sccache-cache-scope: rust-test-impact-unified
