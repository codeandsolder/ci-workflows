name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust-smoke-cache:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@d4006be3222b67ba7769de813a1981f3dd84a43e # main
    with:
      working-directory: smoke-cache
