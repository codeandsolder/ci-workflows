name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust-smoke-cache:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@a85199b5f3ff3a76c035b4412130038d8e831b45 # main
    with:
      working-directory: smoke-cache
