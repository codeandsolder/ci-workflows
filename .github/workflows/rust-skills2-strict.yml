name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust-smoke-cache:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@2d654bca9f27485f3e25ba7bfbf3705b87edd296 # main
    with:
      working-directory: smoke-cache
