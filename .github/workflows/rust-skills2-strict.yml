name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: ":"
      rustflags: ""
      rust-targets: wasm32-wasip1
      strict-suites: |
        [
          {"name":"smoke-cache","directory":"smoke-cache"},
          {"name":"portable-native","directory":"policy-wasm"},
          {"name":"portable-wasi","directory":"policy-wasm","cargo":["--locked","--workspace","--bins","--target","wasm32-wasip1"]}
        ]
