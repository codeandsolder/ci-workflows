name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-26.04
    outputs:
      channel: ${{ steps.compiler.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resolve-rust-toolchain
        id: compiler
  strict-rust-smoke-cache:
    needs: pin
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@4a303f0cdccc1ded17ee86b6d63ab8f84f928c61 # main
    with:
      working-directory: smoke-cache
      rust-toolchain: ${{ needs.pin.outputs.channel }}
  strict-rust-portable-policy:
    needs: pin
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@4a303f0cdccc1ded17ee86b6d63ab8f84f928c61 # main
    with:
      working-directory: policy-wasm
      rust-toolchain: ${{ needs.pin.outputs.channel }}
  strict-rust-portable-wasi:
    needs: pin
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@4a303f0cdccc1ded17ee86b6d63ab8f84f928c61 # main
    with:
      working-directory: policy-wasm
      rust-toolchain: ${{ needs.pin.outputs.channel }}
      rust-targets: wasm32-wasip1
      cargo-args: --locked --workspace --bins --target wasm32-wasip1
