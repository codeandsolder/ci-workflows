name: Fleet CI guard tests

on:
  pull_request:
    paths:
      - scripts/fleet-ci-guard.mjs
      - scripts/fleet-ci-guard.test.mjs
      - ops/systemd/fleet-ci-guard.service
      - ops/systemd/fleet-ci-guard.timer
      - .github/workflows/fleet-ci-guard-tests.yml
      - README.md
  push:
    branches: [main]
    paths:
      - scripts/fleet-ci-guard.mjs
      - scripts/fleet-ci-guard.test.mjs
      - ops/systemd/fleet-ci-guard.service
      - ops/systemd/fleet-ci-guard.timer
      - .github/workflows/fleet-ci-guard-tests.yml
      - README.md
  workflow_dispatch:

concurrency:
  group: fleet-ci-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: GitHub Actions PR run cancellation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test scripts/fleet-ci-guard.test.mjs
