name: Cargo release-age quarantine

on:
  workflow_call:
    inputs:
      runner:
        description: "auto chooses hosted Ubuntu for public callers and the registered local-ci runner for private callers; otherwise use a JSON-encoded runs-on selector."
        required: false
        type: string
        default: auto
      hours:
        description: Minimum crates.io release age in hours.
        required: false
        type: number
        default: 72
      lockfile:
        description: Repository-relative Cargo lockfile path, or auto for all tracked workspaces.
        required: false
        type: string
        default: auto

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ${{ inputs.runner == 'auto' && (github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04') || fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR merge refs contain the base commit among their first parents.
          # Two commits avoid fetching private history without credentials.
          fetch-depth: 2
          persist-credentials: false

      - name: Check out pinned quarantine implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows-quarantine
          persist-credentials: false
          sparse-checkout: |
            .github/actions/cargo-release-quarantine/action.yml
            .github/actions/cargo-release-quarantine/fetch_baseline.sh
            policy-wasm/run.mjs
            policy-wasm/workspace.mjs
            policy-wasm/module.mjs
            policy-wasm/module.json
            policy-wasm/module.wasm.gz
            policy-wasm/quarantine.mjs
          sparse-checkout-cone-mode: false

      - name: Enforce crates.io release-age quarantine
        uses: ./.ci-workflows-quarantine/.github/actions/cargo-release-quarantine
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          hours: ${{ inputs.hours }}
          lockfile: ${{ inputs.lockfile }}
