name: Check caller Actions concurrency policy

on:
  workflow_call:
    inputs:
      runner:
        description: "auto selects local-ci for private callers and hosted Ubuntu for public callers; otherwise supply a JSON-encoded runs-on selector."
        type: string
        default: auto

permissions:
  contents: read

jobs:
  validate:
    name: Check PR workflow cancellation
    runs-on: ${{ inputs.runner == 'auto' && (github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04') || fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned shared policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-ci-policy
          persist-credentials: false
          sparse-checkout: |
            .github/actions/workflow-concurrency-policy
            .github/actions/actionlint-policy
            policy-wasm/run.mjs
            languages/actionlint
            languages/tools/install.sh
            policy-wasm/workspace.mjs
            policy-wasm/module.mjs
            policy-wasm/module.json
            policy-wasm/module.wasm.gz
          sparse-checkout-cone-mode: false

      - name: Check all caller workflows
        uses: ./.shared-ci-policy/.github/actions/workflow-concurrency-policy
      - name: Validate workflow structure and expressions with actionlint
        uses: ./.shared-ci-policy/.github/actions/actionlint-policy
