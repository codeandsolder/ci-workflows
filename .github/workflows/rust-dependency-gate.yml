name: Mandatory Rust dependency gate

on:
  workflow_call:
    inputs:
      working-directories:
        description: JSON array of repository-relative Cargo workspace roots
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned dependency gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions/rust-dependency-quality
            .github/actions/resolve-rust-toolchain
            rust-toolchain.toml
          sparse-checkout-cone-mode: false

      # Metadata-only scanning uses the provider's quarantined compiler.
      # This does not change a legacy caller's own build toolchain.
      - name: Resolve quarantined metadata compiler
        id: compiler
        uses: ./.ci-workflows/.github/actions/resolve-rust-toolchain
        with:
          repository-path: .ci-workflows

      - name: Install metadata compiler
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Enforce dependency consolidation
        uses: ./.ci-workflows/.github/actions/rust-dependency-quality
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
        with:
          working-directories: ${{ inputs.working-directories }}
