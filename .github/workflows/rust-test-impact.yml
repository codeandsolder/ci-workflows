name: Unified Rust test suite

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Exact toolchain or the caller's routine pinned toolchain
        type: string
        required: false
        default: ""
      test-suite:
        description: JSON configuration of the authoritative Nextest suite
        type: string
        required: false
        default: '{}'
      runner:
        type: string
        required: false
        default: "ubuntu-24.04"
      timeout-minutes:
        type: number
        required: false
        default: 90

permissions:
  contents: read
  actions: read

jobs:
  impact:
    uses: ./.github/workflows/rust-sccache.yml
    with:
      command: ":"
      rust-toolchain: ${{ inputs.rust-toolchain }}
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      sccache-cache-scope: rust-test-impact
      test-suite: ${{ inputs.test-suite }}
