name: Hosted sccache fleet canary
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  hosted-canary:
    if: github.repository == 'codeandsolder/ci-workflows' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/hosted-sccache-canary-job.yml
    secrets:
      SCCACHE_HOSTED_CANARY_IDENTITY: ${{ secrets.SCCACHE_HOSTED_CANARY_IDENTITY }}
