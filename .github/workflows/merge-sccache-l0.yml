name: Merge shared sccache L0

on:
  workflow_call:
    inputs:
      source-run-id:
        description: Workflow run that produced sccache-l0-delta, or 0 for bootstrap-only
        required: false
        default: "0"
        type: string
      source-event:
        description: Event that triggered the source workflow
        required: false
        default: ""
        type: string
      bootstrap-only:
        description: Convert an existing v1 default-branch snapshot into the canonical v2 lineage
        required: false
        default: false
        type: boolean
      runner:
        description: GitHub-hosted runner label
        required: false
        default: "ubuntu-22.04"
        type: string
    outputs:
      garage-upload-cache-key:
        description: Exact transient cache key containing the source L0 delta for trusted Garage upload
        value: ${{ jobs.merge.outputs.garage-upload-cache-key }}

permissions:
  actions: write
  contents: read
  id-token: write

# workflow_run is intentionally read-only for caches by default. This reusable
# workflow is called only after a caller has gated the source event to trusted
# push/workflow_dispatch runs.
cache-mode: write

env:
  TAILSCALE_CLIENT_ID: "TUBzGLiWBZ11CNTRL-kRiRQY5Gto11CNTRL"
  TAILSCALE_AUDIENCE: "api.tailscale.com/TUBzGLiWBZ11CNTRL-kRiRQY5Gto11CNTRL"

concurrency:
  group: sccache-l0-merge-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      inputs.bootstrap-only ||
      inputs.source-event == 'push' ||
      inputs.source-event == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      garage-upload-cache-key: ${{ steps.garage-queue-key.outputs.key }}

    steps:
      - name: Locate source delta
        id: delta
        if: inputs.source-run-id != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "sccache-l0-delta") | .id' \
              | head -n1
          )"
          if [[ -n "$artifact_id" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source delta
        if: steps.delta.outputs.exists == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sccache-l0-delta
          path: ${{ runner.temp }}/sccache-l0-delta
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source-run-id }}

      - name: Resolve L0 namespace and bound
        id: metadata
        if: inputs.bootstrap-only || steps.delta.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.delta.outputs.exists }}" == "true" ]]; then
            metadata="$RUNNER_TEMP/sccache-l0-delta/metadata.json"
            namespace="$(jq -er '.namespace' "$metadata")"
            limit_bytes="$(jq -er '.limit_bytes' "$metadata")"
            garage_upload_concurrency="$(jq -er '.garage_upload_concurrency // 4' "$metadata")"
          else
            namespace="sccache-l0-rust-v7-layout2-canonical-v2-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_REPOSITORY_ID}"
            limit_bytes=$((1024 * 1024 * 1024))
            garage_upload_concurrency=4
          fi

          if [[ ! "$namespace" =~ ^sccache-l0-[A-Za-z0-9._-]+$ ]]; then
            echo "invalid L0 namespace: $namespace" >&2
            exit 1
          fi
          if (( limit_bytes < 67108864 || limit_bytes > 8589934592 )); then
            echo "invalid L0 size bound: $limit_bytes" >&2
            exit 1
          fi
          if [[ ! "$garage_upload_concurrency" =~ ^[0-9]+$ ]] \
             || (( garage_upload_concurrency < 1 || garage_upload_concurrency > 64 )); then
            echo "invalid Garage upload concurrency: $garage_upload_concurrency" >&2
            exit 1
          fi

          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "limit_bytes=$limit_bytes" >> "$GITHUB_OUTPUT"
          echo "garage_upload_concurrency=$garage_upload_concurrency" >> "$GITHUB_OUTPUT"

      - name: Restore local sccache L0
        id: l0-restore
        if: inputs.bootstrap-only || steps.delta.outputs.exists == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/sccache-l0
          key: ${{ steps.metadata.outputs.namespace }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.metadata.outputs.namespace }}-

      - name: Merge and bound L0
        id: merge
        if: inputs.bootstrap-only || steps.delta.outputs.exists == 'true'
        shell: bash
        env:
          HAVE_DELTA: ${{ steps.delta.outputs.exists || 'false' }}
          BOOTSTRAP_ONLY: ${{ inputs.bootstrap-only }}
          L0_LIMIT_BYTES: ${{ steps.metadata.outputs.limit_bytes }}
        run: |
          set -euo pipefail
          l0="$RUNNER_TEMP/sccache-l0"
          mkdir -p "$l0"

          before_files="$(find "$l0" -type f | wc -l)"
          before_bytes="$(du -sb "$l0" | awk '{print $1}')"

          if [[ "$HAVE_DELTA" == "true" ]]; then
            delta="$RUNNER_TEMP/sccache-l0-delta/sccache-l0-delta.tar.zst"

            while IFS= read -r path; do
              if [[ -z "$path" || "$path" == /* || "$path" == ".." || "$path" == ../* || "$path" == */../* ]]; then
                echo "unsafe path in L0 delta: $path" >&2
                exit 1
              fi
            done < <(tar --zstd -tf "$delta")

            tar --zstd -xf "$delta" -C "$l0"
          fi

          L0_DIR="$l0" python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["L0_DIR"])
          limit = int(os.environ["L0_LIMIT_BYTES"])
          files = [path for path in root.rglob("*") if path.is_file()]
          entries = []
          total = 0
          for path in files:
              stat = path.stat()
              total += stat.st_size
              entries.append((stat.st_mtime_ns, stat.st_size, path))

          removed_files = 0
          removed_bytes = 0
          if total > limit:
              for _mtime, size, path in sorted(entries):
                  if total <= limit:
                      break
                  try:
                      path.unlink()
                  except FileNotFoundError:
                      continue
                  total -= size
                  removed_files += 1
                  removed_bytes += size

          for directory in sorted(
              (path for path in root.rglob("*") if path.is_dir()),
              key=lambda path: len(path.parts),
              reverse=True,
          ):
              try:
                  directory.rmdir()
              except OSError:
                  pass

          print(
              f"bounded_l0_bytes={total} "
              f"pruned_files={removed_files} pruned_bytes={removed_bytes}"
          )
          PY

          after_files="$(find "$l0" -type f | wc -l)"
          after_bytes="$(du -sb "$l0" | awk '{print $1}')"
          printf 'l0_before_files=%s l0_before_bytes=%s l0_after_files=%s l0_after_bytes=%s\n' \
            "$before_files" "$before_bytes" "$after_files" "$after_bytes"

          if [[ "$after_files" -gt 0 && ( "$HAVE_DELTA" == "true" || "$BOOTSTRAP_ONLY" == "true" ) ]]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save merged L0
        if: steps.merge.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/sccache-l0
          key: ${{ steps.l0-restore.outputs.cache-primary-key }}

      - name: Prepare trusted Garage upload queue
        id: garage-queue-key
        if: steps.delta.outputs.exists == 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: |
          set -euo pipefail
          key="sccache-garage-delta-${GITHUB_REPOSITORY_ID}-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Save trusted Garage upload queue
        if: steps.delta.outputs.exists == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/sccache-l0-delta
          key: ${{ steps.garage-queue-key.outputs.key }}

  garage-upload:
    needs: merge
    if: needs.merge.outputs.garage-upload-cache-key != ''
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@main
    with:
      garage-upload-only: true
      garage-upload-cache-key: ${{ needs.merge.outputs.garage-upload-cache-key }}
      runner: ${{ inputs.runner }}

  cleanup-garage-queue:
    needs: [merge, garage-upload]
    if: >-
      always() &&
      needs.garage-upload.result == 'success' &&
      needs.merge.outputs.garage-upload-cache-key != ''
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete transient Garage queue and source delta
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ needs.merge.outputs.garage-upload-cache-key }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: |
          set -euo pipefail

          cache_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$CACHE_KEY" \
              --jq '.actions_caches[0].id // empty'
          )"
          if [[ -n "$cache_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
          fi

          artifact_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "sccache-l0-delta") | .id' \
              | head -n1
          )"
          if [[ -n "$artifact_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi

