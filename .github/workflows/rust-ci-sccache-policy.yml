name: Shared Rust CI sccache policy

on:
  pull_request:
    paths:
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/scripts/test-rust-ci-sccache-policy.py"
      - ".github/scripts/rust-ci-sccache-oracle.py"
      - "policy-wasm/**"
      - ".github/pyproject.toml"
      - ".github/uv.lock"
      - ".github/workflows/rust-ci-sccache-policy.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/scripts/test-rust-ci-sccache-policy.py"
      - ".github/scripts/rust-ci-sccache-oracle.py"
      - "policy-wasm/**"
      - ".github/pyproject.toml"
      - ".github/uv.lock"
      - ".github/workflows/rust-ci-sccache-policy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Verify Rust CI sccache regression fixtures
        run: uv run --project .github --locked python -B .github/scripts/test-rust-ci-sccache-policy.py --wasm policy-wasm/module.json
      - name: Enforce Rust CI sccache rules on provider workflows
        uses: ./.github/actions/rust-ci-sccache-policy
