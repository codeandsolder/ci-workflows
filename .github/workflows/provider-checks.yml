name: Provider workflow checks

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/resolve-rust-toolchain/**"
      - ".github/actions/install-rust-toolchain/**"
      - ".github/actions/native-packages/**"
      - ".github/actions/workflow-concurrency-policy/**"
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/actions/actionlint-policy/**"
      - ".github/actions/merge-gate/**"
      - ".github/actions/rust-test-impact/**"
      - ".github/actions/rust-strict-suites/**"
      - "languages/actionlint/**"
      - "languages/tools/**"
      - "languages/detect*.mjs"
      - "languages/run*.mjs"
      - "languages/wgsl/Cargo.*"
      - "scripts/nightly-toolchain*.mjs"
      - "rust-toolchain.toml"
      - "policy-wasm/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/resolve-rust-toolchain/**"
      - ".github/actions/install-rust-toolchain/**"
      - ".github/actions/native-packages/**"
      - ".github/actions/workflow-concurrency-policy/**"
      - ".github/actions/rust-ci-sccache-policy/**"
      - ".github/actions/actionlint-policy/**"
      - ".github/actions/merge-gate/**"
      - ".github/actions/rust-test-impact/**"
      - ".github/actions/rust-strict-suites/**"
      - "languages/actionlint/**"
      - "languages/tools/**"
      - "languages/detect*.mjs"
      - "languages/run*.mjs"
      - "languages/wgsl/Cargo.*"
      - "scripts/nightly-toolchain*.mjs"
      - "rust-toolchain.toml"
      - "policy-wasm/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Toolchain, cache and workflow policy
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/nightly-toolchain.test.mjs .github/actions/merge-gate/evaluate.test.mjs
      - run: bash .github/actions/install-rust-toolchain/test.sh
      - name: Install native package regression prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
      - run: bash .github/actions/native-packages/test.sh
      - run: node --test languages/detect.test.mjs languages/run.test.mjs .github/actions/rust-test-impact/*.test.mjs .github/actions/rust-strict-suites/*.test.mjs
      - name: Exercise independent Naga crate inside a caller Cargo workspace
        shell: bash
        run: |
          set -euo pipefail
          caller="$(mktemp -d "$RUNNER_TEMP/nested-caller.XXXXXX")"
          printf '[package]\nname = "caller"\nversion = "0.1.0"\nedition = "2024"\n\n[workspace]\nmembers = ["tools/*"]\n' > "$caller/Cargo.toml"
          mkdir -p "$caller/.shared-language-quality/languages"
          cp -a languages/wgsl "$caller/.shared-language-quality/languages/wgsl"
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path "$caller/.shared-language-quality/languages/wgsl/Cargo.toml" \
            > "$RUNNER_TEMP/nested-wgsl-metadata.json"
          node -e 'const assert = require("node:assert/strict"); const metadata = require(process.argv[1]); assert.equal(metadata.packages.length, 1); assert.equal(metadata.packages[0].name, "shared-ci-wgsl-quality"); assert.equal(metadata.workspace_root, metadata.packages[0].manifest_path.replace(/\/Cargo.toml$/, ""));' \
            "$RUNNER_TEMP/nested-wgsl-metadata.json"
      - uses: ./.github/actions/resolve-rust-toolchain
      - name: Enforce Rust CI sccache rules on provider workflows
        uses: ./.github/actions/rust-ci-sccache-policy
      - name: Verify the checked-out workflow cancellation policy
        uses: ./.github/actions/workflow-concurrency-policy
      - name: Validate workflow structure and expressions
        uses: ./.github/actions/actionlint-policy
