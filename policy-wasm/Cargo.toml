[package]
name = "ci-policy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
caseless = "0.2.2"
regex = "1"
saphyr = { version = "0.3.3", default-features = false }
saphyr-parser = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ra-ap-rustc_lexer = "0.186"
memchr = "2"

[profile.release]
lto = "thin"
